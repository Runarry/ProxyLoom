        "application/json":
          schema: { $ref: "#/components/schemas/TokenListResponse" }
    TokenResponse:
      description: "Typed contract response. This operation is not registered by the foundation contract implementation."
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        "application/json":
          schema: { $ref: "#/components/schemas/TokenResponse" }
    JobOrBatchResponse:
      description: "Persistent child JobResponse or aggregate parent TestBatchResponse, selected by the UUID kind."
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        "application/json":
          schema:
            oneOf:
              - { $ref: "#/components/schemas/JobResponse" }
              - { $ref: "#/components/schemas/TestBatchResponse" }
    PublicNotFound:
      description: "Identical generic 404 for invalid, expired, revoked or target-unauthorized token; never reveals whether the token or profile exists."
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        X-Content-Type-Options:
          schema:
            type: "string"
            const: "nosniff"
      content:
        "application/json":
          schema: { $ref: "#/components/schemas/ErrorResponse" }
        "text/plain":
          schema:
            type: "string"
            minLength: 1
            maxLength: 200
            description: "Fixed generic safe error text; no configuration, credentials or internal diagnostics."
    PublicRateLimited:
      description: "Public request limit exceeded; response is an error, never proxy configuration."
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        X-Content-Type-Options:
          schema:
            type: "string"
            const: "nosniff"
      content:
        "application/json":
          schema: { $ref: "#/components/schemas/ErrorResponse" }
        "text/plain":
          schema:
            type: "string"
            minLength: 1
            maxLength: 200
            description: "Fixed generic safe error text; no configuration, credentials or internal diagnostics."
    PublicUnavailable:
      description: "Authorized token has no safe publication, publication is blocked, or primary database is unavailable. No cached authorization, empty config or direct fallback."
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        X-Content-Type-Options:
          schema:
            type: "string"
            const: "nosniff"
      content:
        "application/json":
          schema: { $ref: "#/components/schemas/ErrorResponse" }
        "text/plain":
          schema:
            type: "string"
            minLength: 1
            maxLength: 200
            description: "Fixed generic safe error text; no configuration, credentials or internal diagnostics."
  schemas:
    UUID:
      type: "string"
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    RequestID:
      type: "string"
      pattern: "^[A-Za-z0-9_-]{1,64}$"
    Revision:
      type: "string"
      pattern: "^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
      description: "Canonical positive decimal int64 string, 1..9223372036854775807. String encoding preserves exact values in browser clients. No signs or leading zeros."
    Counter:
      type: "string"
      pattern: "^(?:0|[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$"
      description: "Canonical nonnegative decimal int64 string, 0..9223372036854775807. No signs or leading zeros."
    SchemaVersion:
      type: "integer"
      const: 1
    ShortText:
      type: "string"
      minLength: 1
      maxLength: 200
      pattern: "^[^\\x00-\\x1f\\x7f]+$"
    Name:
      type: "string"
      minLength: 1
      maxLength: 256
      pattern: "^[^\\x00-\\x1f\\x7f]+$"
    Tags:
      type: "array"
      minItems: 0
      maxItems: 100
      items: { $ref: "#/components/schemas/Tag" }
      uniqueItems: true
    SHA256:
      type: "string"
      pattern: "^[0-9a-f]{64}$"
    TargetKey:
      type: "string"
      pattern: "^[a-z][a-z0-9_-]{0,63}$"
    Timestamp:
      type: "string"
      format: "date-time"
    SafeFieldPath:
      type: "string"
      maxLength: 512
      pattern: "^(?:/(?:[a-z][a-z0-9_]*|[0-9]+))*$"
      description: "Safe RFC 6901 pointer using only fixed, validated contract fields and array indices; root is empty. Unknown or duplicate input keys are represented by their safe parent, never echoed. Syntax alone is not authorization to output a supplied path."
    ErrorCode:
      type: "string"
      enum: ["MALFORMED_REQUEST", "UNKNOWN_FIELD", "DUPLICATE_FIELD", "AUTH_REQUIRED", "SESSION_EXPIRED", "PERMISSION_DENIED", "REAUTH_REQUIRED", "RESOURCE_NOT_FOUND", "STATE_CONFLICT", "IDEMPOTENCY_CONFLICT", "LEASE_LOST", "REVISION_MISMATCH", "INPUT_LIMIT_EXCEEDED", "VALIDATION_FAILED", "PRECONDITION_REQUIRED", "RATE_LIMITED", "SERVICE_UNAVAILABLE", "INTERNAL_ERROR", "COMPILE_OBSOLETE", "CAPABILITY_UNSUPPORTED", "CAPABILITY_UNVERIFIED", "DEPENDENCY_EXCLUDED", "DEPENDENCY_CYCLE", "DNS_CYCLE", "EMPTY_GROUP", "PUBLICATION_BLOCKED", "PUBLICATION_CONFIRMATION_REQUIRED", "SUBSCRIPTION_NOT_READY", "SUBSCRIPTION_BLOCKED", "RUNNER_UNAVAILABLE", "BUDGET_EXCEEDED", "INVALID_CONFIG", "CORE_CONFIG_INVALID", "PROXY_CONNECT_FAILED", "AUTH_FAILED", "TARGET_TLS_FAILED", "HTTP_EXPECTATION_FAILED", "CORE_BINARY_MISMATCH", "PORT_BUSY", "RUNNER_RESOURCE_LIMIT", "CANCELED", "JOB_TIMEOUT", "TEST_TARGET_UNAVAILABLE", "INSUFFICIENT_SAMPLE"]
    ErrorDetail:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        field_path: { $ref: "#/components/schemas/SafeFieldPath" }
        resource_id: { $ref: "#/components/schemas/UUID" }
      minProperties: 1
    SafeError:
      type: "object"
      additionalProperties: false
      required: ["code", "message", "details"]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message:
          type: "string"
          minLength: 1
          maxLength: 512
          description: "Bounded fixed safe explanation; no input values, SQL, ciphertext, URLs, raw schema messages or core stdout/stderr."
        details:
          type: "array"
          minItems: 0
          maxItems: 64
          items: { $ref: "#/components/schemas/ErrorDetail" }
    ErrorResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "error"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        error: { $ref: "#/components/schemas/SafeError" }
    Diagnostic:
      type: "object"
      additionalProperties: false
      required: ["code", "severity", "message"]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        severity:
          type: "string"
          enum: ["info", "warning", "error"]
        message:
          type: "string"
          minLength: 1
          maxLength: 512
          description: "Fixed redacted explanation."
        field_path: { $ref: "#/components/schemas/SafeFieldPath" }
        resource_id: { $ref: "#/components/schemas/UUID" }
        target_key: { $ref: "#/components/schemas/TargetKey" }
    Diagnostics:
      type: "array"
      minItems: 0
      maxItems: 200
      items: { $ref: "#/components/schemas/Diagnostic" }
    PageInfo:
      type: "object"
      additionalProperties: false
      required: ["limit"]
      properties:
        limit:
          type: "integer"
          minimum: 1
          maximum: 200
          default: 50
        next_cursor:
          type: "string"
          minLength: 1
          maxLength: 2048
          description: "Opaque authenticated cursor; omitted at end. Bound to scope, collection, ordering and normalized filter digest. Cursor is not authorization."
    AcknowledgementResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data:
          type: "object"
          additionalProperties: false
          required: ["acknowledged"]
          properties:
            acknowledged:
              type: "boolean"
              const: true
    IdempotencyReceipt:
      type: "object"
      additionalProperties: false
      required: ["replayed", "http_status", "status"]
      properties:
        replayed:
          type: "boolean"
        http_status:
          type: "integer"
          enum: [200, 201, 202, 204]
        resource_id: { $ref: "#/components/schemas/UUID" }
        revision: { $ref: "#/components/schemas/Revision" }
        operation_id: { $ref: "#/components/schemas/UUID" }
        status:
          type: "string"
          enum: ["created", "updated", "deleted", "revoked", "accepted"]
      description: "Allowlisted replay metadata only. The fixed route determines operation_id semantics (job, batch, publication or token). No raw response bytes, token, URL, auth value or arbitrary metadata are persistable. Replay repeats current authorization and does not advance the catalog revision."
    IdempotencyReceiptResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/IdempotencyReceipt" }
    MutationReceipt:
      type: "object"
      additionalProperties: false
      required: ["resource_id", "revision", "security_epoch", "status"]
      properties:
        resource_id: { $ref: "#/components/schemas/UUID" }
        revision: { $ref: "#/components/schemas/Revision" }
        security_epoch: { $ref: "#/components/schemas/Revision" }
        status:
          type: "string"
          enum: ["updated", "deleted", "revoked"]
    MutationResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/MutationReceipt" }
    ReasonRequest:
      type: "object"
      additionalProperties: false
      required: ["reason"]
      properties:
        reason:
          type: "string"
          minLength: 1
          maxLength: 200
          description: "Administrative reason; exclude credentials and configuration."
    ResourceKind:
      type: "string"
      enum: ["node", "chain", "policy_group", "routing_profile", "dns_profile", "rule_set", "client_preset", "subscription_profile", "source"]
    ResourceMetadata:
      type: "object"
      additionalProperties: false
      required: ["resource_id", "scope_id", "kind", "revision", "schema_version", "name", "tags", "enabled", "security_epoch"]
      properties:
        resource_id: { $ref: "#/components/schemas/UUID" }
        scope_id: { $ref: "#/components/schemas/UUID" }
        kind: { $ref: "#/components/schemas/ResourceKind" }
        revision: { $ref: "#/components/schemas/Revision" }
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        name: { $ref: "#/components/schemas/Name" }
        tags: { $ref: "#/components/schemas/Tags" }
        enabled:
          type: "boolean"
        security_epoch: { $ref: "#/components/schemas/Revision" }
    Secret:
      type: "string"
      minLength: 1
      maxLength: 4096
      pattern: "^[^\\x00]+$"
      not:
        enum: ["********", "REDACTED", "<redacted>", "[REDACTED]"]
      x-sensitive: true
      description: "Real secret, never a display mask. Only allowed in explicit secret input or privileged one-time reveal responses; ordinary read schemas are separate."
    SecretPatch:
      type: ["string", "null"]
      maxLength: 4096
      x-sensitive: true
      description: "Patch tri-state: absent preserves, null clears and a string replaces. String content (including empty, masks and protocol format) is checked only after typed merge; domain-invalid credentials return 422. This structural DTO never makes the merged secret valid by itself."
    SecretUUID:
      $ref: "#/components/schemas/UUID"
      x-sensitive: true
    SecretUUIDPatch: { $ref: "#/components/schemas/SecretPatch" }
    Host:
      type: "string"
      minLength: 1
      maxLength: 253
      pattern: "^[^A-Z]+$"
      anyOf:
        -
          type: "string"
          format: "hostname"
        -
          type: "string"
          format: "ipv4"
        -
          type: "string"
          format: "ipv6"
      description: "Normalized lowercase ASCII hostname or unbracketed IP; no URI, port or path. Format assertions are required."
    IPAddress:
      type: "string"
      anyOf:
        -
          type: "string"
          format: "ipv4"
        -
          type: "string"
          format: "ipv6"
    Endpoint:
      type: "object"
      additionalProperties: false
      required: ["host", "port"]
      properties:
        host: { $ref: "#/components/schemas/Host" }
        port:
          type: "integer"
          minimum: 1
          maximum: 65535
    Protocol:
      type: "string"
      enum: ["shadowsocks", "vmess", "vless", "trojan", "socks5", "http"]
    ShadowsocksMethod:
      type: "string"
      enum: ["aes-128-gcm", "aes-256-gcm", "chacha20-ietf-poly1305"]
    VMessCipher:
      type: "string"
      enum: ["auto", "aes-128-gcm", "chacha20-poly1305", "none", "zero"]
    MethodPasswordAuth:
      type: "object"
      additionalProperties: false
      required: ["kind", "method", "password"]
      properties:
        kind:
          const: "method_password"
          type: "string"
        method: { $ref: "#/components/schemas/ShadowsocksMethod" }
        password: { $ref: "#/components/schemas/Secret" }
    VMessAuth:
      type: "object"
      additionalProperties: false
      required: ["kind", "uuid", "cipher"]
      properties:
        kind:
          const: "vmess_aead"
          type: "string"
        uuid: { $ref: "#/components/schemas/SecretUUID" }
        cipher: { $ref: "#/components/schemas/VMessCipher" }
    UUIDAuth:
      type: "object"
      additionalProperties: false
      required: ["kind", "uuid"]
      properties:
        kind:
          const: "uuid"
          type: "string"
        uuid: { $ref: "#/components/schemas/SecretUUID" }
    PasswordAuth:
      type: "object"
      additionalProperties: false
      required: ["kind", "password"]
      properties:
        kind:
          const: "password"
          type: "string"
        password: { $ref: "#/components/schemas/Secret" }
    UsernamePasswordAuth:
      type: "object"
      additionalProperties: false
      required: ["kind", "username", "password"]
      properties:
        kind:
          const: "username_password"
          type: "string"
        username: { $ref: "#/components/schemas/Secret" }
        password: { $ref: "#/components/schemas/Secret" }
    NoAuth:
      type: "object"
      additionalProperties: false
      required: ["kind"]
      properties:
        kind:
          const: "none"
          type: "string"
    NodeAuth:
      oneOf:
        - { $ref: "#/components/schemas/MethodPasswordAuth" }
        - { $ref: "#/components/schemas/VMessAuth" }
        - { $ref: "#/components/schemas/UUIDAuth" }
        - { $ref: "#/components/schemas/PasswordAuth" }
        - { $ref: "#/components/schemas/UsernamePasswordAuth" }
        - { $ref: "#/components/schemas/NoAuth" }
    MethodPasswordAuthPatch:
      type: "object"
      additionalProperties: false
      required: ["kind"]
      properties:
        kind:
          const: "method_password"
          type: "string"
        method: { $ref: "#/components/schemas/ShadowsocksMethod" }
        password: { $ref: "#/components/schemas/SecretPatch" }
    VMessAuthPatch:
      type: "object"
      additionalProperties: false
      required: ["kind"]
      properties:
        kind:
          const: "vmess_aead"
          type: "string"
        uuid: { $ref: "#/components/schemas/SecretUUIDPatch" }
        cipher: { $ref: "#/components/schemas/VMessCipher" }
    UUIDAuthPatch:
      type: "object"
      additionalProperties: false
      required: ["kind"]
      properties:
        kind:
          const: "uuid"
          type: "string"
        uuid: { $ref: "#/components/schemas/SecretUUIDPatch" }
    PasswordAuthPatch:
      type: "object"
      additionalProperties: false
      required: ["kind"]
      properties:
        kind:
          const: "password"
          type: "string"
        password: { $ref: "#/components/schemas/SecretPatch" }
    UsernamePasswordAuthPatch:
      type: "object"
      additionalProperties: false
      required: ["kind"]
      properties:
        kind:
          const: "username_password"
          type: "string"
        username: { $ref: "#/components/schemas/SecretPatch" }
        password: { $ref: "#/components/schemas/SecretPatch" }
    NodeAuthPatch:
      oneOf:
        - { $ref: "#/components/schemas/MethodPasswordAuthPatch" }
        - { $ref: "#/components/schemas/VMessAuthPatch" }
        - { $ref: "#/components/schemas/UUIDAuthPatch" }
        - { $ref: "#/components/schemas/PasswordAuthPatch" }
        - { $ref: "#/components/schemas/UsernamePasswordAuthPatch" }
        - { $ref: "#/components/schemas/NoAuth" }
      description: "Discriminated typed merge. Absent preserves, null clears, string replaces. Revalidate the merged protocol; required-secret removal is 422. A changed kind never inherits unrelated secret fields."
    MethodPasswordAuthRedacted:
      type: "object"
      additionalProperties: false
      required: ["kind", "method", "has_password"]
      properties:
        kind:
          const: "method_password"
          type: "string"
        method: { $ref: "#/components/schemas/ShadowsocksMethod" }
        has_password:
          type: "boolean"
    VMessAuthRedacted:
      type: "object"
      additionalProperties: false
      required: ["kind", "cipher", "has_uuid"]
      properties:
        kind:
          const: "vmess_aead"
          type: "string"
        cipher: { $ref: "#/components/schemas/VMessCipher" }
        has_uuid:
          type: "boolean"
    UUIDAuthRedacted:
      type: "object"
      additionalProperties: false
      required: ["kind", "has_uuid"]
      properties:
        kind:
          const: "uuid"
          type: "string"
        has_uuid:
          type: "boolean"
    PasswordAuthRedacted:
      type: "object"
      additionalProperties: false
      required: ["kind", "has_password"]
      properties:
        kind:
          const: "password"
          type: "string"
        has_password:
          type: "boolean"
    UsernamePasswordAuthRedacted:
      type: "object"
      additionalProperties: false
      required: ["kind", "has_username", "has_password"]
      properties:
        kind:
          const: "username_password"
          type: "string"
        has_username:
          type: "boolean"
        has_password:
          type: "boolean"
    NodeAuthRedacted:
      oneOf:
        - { $ref: "#/components/schemas/MethodPasswordAuthRedacted" }
        - { $ref: "#/components/schemas/VMessAuthRedacted" }
        - { $ref: "#/components/schemas/UUIDAuthRedacted" }
        - { $ref: "#/components/schemas/PasswordAuthRedacted" }
        - { $ref: "#/components/schemas/UsernamePasswordAuthRedacted" }
        - { $ref: "#/components/schemas/NoAuth" }
    NativeTCPTransport:
      type: "object"
      additionalProperties: false
      required: ["kind"]
      properties:
        kind:
          const: "native_tcp"
          type: "string"
    WebSocketTransport:
      type: "object"
      additionalProperties: false
      required: ["kind", "path"]
      properties:
        kind:
          const: "websocket"
          type: "string"
        path:
          type: "string"
          maxLength: 2048
          pattern: "^/[^\\x00-\\x20\\x7f#]*$"
        host: { $ref: "#/components/schemas/Host" }
    NodeTransport:
      oneOf:
        - { $ref: "#/components/schemas/NativeTCPTransport" }
        - { $ref: "#/components/schemas/WebSocketTransport" }
    ALPN:
      type: "array"
      minItems: 1
      maxItems: 16
      items: { $ref: "#/components/schemas/ShortText" }
    ALPNPatch:
      type: "array"
      minItems: 0
      maxItems: 16
      items: { $ref: "#/components/schemas/ShortText" }
      description: "An empty patch array clears optional ALPN; omission preserves the current value."
    FingerprintPatch:
      anyOf:
        - { $ref: "#/components/schemas/Fingerprint" }
        - { type: "null" }
      description: "Omitted preserves, string replaces, null clears optional TLS fingerprint. Clearing required REALITY fingerprint fails final node validation."
    Fingerprint:
      type: "string"
      pattern: "^[a-z][a-z0-9_-]{0,63}$"
    RealityPublicKey:
      type: "string"
      pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
      x-sensitive: true
    RealityShortID:
      type: "string"
      pattern: "^([0-9a-f]{2}){0,8}$"
      x-sensitive: true
    NoSecurity:
      type: "object"
      additionalProperties: false
      required: ["mode"]
      properties:
        mode:
          type: "string"
          const: "none"
    TLSSecurity:
      type: "object"
      additionalProperties: false
      required: ["mode", "server_name", "verify_certificate"]
      properties:
        mode:
          type: "string"
          const: "tls"
        server_name: { $ref: "#/components/schemas/Host" }
        verify_certificate:
          type: "boolean"
        alpn: { $ref: "#/components/schemas/ALPN" }
        client_fingerprint: { $ref: "#/components/schemas/Fingerprint" }
    RealitySecurity:
      type: "object"
      additionalProperties: false
      required: ["mode", "server_name", "public_key", "short_id", "client_fingerprint"]
      properties:
        mode:
          type: "string"
          const: "reality"
        server_name: { $ref: "#/components/schemas/Host" }
        public_key: { $ref: "#/components/schemas/RealityPublicKey" }
        short_id: { $ref: "#/components/schemas/RealityShortID" }
        client_fingerprint: { $ref: "#/components/schemas/Fingerprint" }
        alpn: { $ref: "#/components/schemas/ALPN" }
    NodeSecurity:
      oneOf:
        - { $ref: "#/components/schemas/NoSecurity" }
        - { $ref: "#/components/schemas/TLSSecurity" }
        - { $ref: "#/components/schemas/RealitySecurity" }
    TLSSecurityPatch:
      type: "object"
      additionalProperties: false
      required: ["mode"]
      properties:
        mode:
          type: "string"
          const: "tls"
        server_name: { $ref: "#/components/schemas/Host" }
        verify_certificate:
          type: "boolean"
        alpn: { $ref: "#/components/schemas/ALPNPatch" }
        client_fingerprint: { $ref: "#/components/schemas/FingerprintPatch" }
    RealitySecurityPatch:
      type: "object"
      additionalProperties: false
      required: ["mode"]
      properties:
        mode:
          type: "string"
          const: "reality"
        server_name: { $ref: "#/components/schemas/Host" }
        public_key: { $ref: "#/components/schemas/SecretPatch" }
        short_id: { $ref: "#/components/schemas/SecretPatch" }
        client_fingerprint: { $ref: "#/components/schemas/FingerprintPatch" }
        alpn: { $ref: "#/components/schemas/ALPNPatch" }
    NodeSecurityPatch:
      oneOf:
        - { $ref: "#/components/schemas/NoSecurity" }
        - { $ref: "#/components/schemas/TLSSecurityPatch" }
        - { $ref: "#/components/schemas/RealitySecurityPatch" }
      description: "Same-mode typed merge preserves absent fields; mode changes require the final merged security object to be complete. REALITY secrets support absent/null/string; required clear is 422."
    RealitySecurityRedacted:
      type: "object"
      additionalProperties: false
      required: ["mode", "server_name", "has_public_key", "has_short_id", "client_fingerprint"]
      properties:
        mode:
          type: "string"
          const: "reality"
        server_name: { $ref: "#/components/schemas/Host" }
        has_public_key:
          type: "boolean"
        has_short_id:
          type: "boolean"
        client_fingerprint: { $ref: "#/components/schemas/Fingerprint" }
        alpn: { $ref: "#/components/schemas/ALPN" }
    NodeSecurityRedacted:
      oneOf:
        - { $ref: "#/components/schemas/NoSecurity" }
        - { $ref: "#/components/schemas/TLSSecurity" }
        - { $ref: "#/components/schemas/RealitySecurityRedacted" }
    NodeFeatures:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        udp:
          type: "boolean"
        multiplex:
          type: "boolean"
        protocol_variant:
          type: "string"
          const: "xtls-rprx-vision"
    NodeExtensions:
      type: "object"
      additionalProperties: false
      required: []
      properties: {}
      description: "IR v1 extension whitelist is empty. Native namespaces, dependency fields and execution settings are not accepted."
    NodeOrigin:
      type: "object"
      additionalProperties: false
      required: ["source_resource_id", "source_item_id", "match_method"]
      properties:
        source_resource_id: { $ref: "#/components/schemas/UUID" }
        source_item_id: { $ref: "#/components/schemas/UUID" }
        match_method:
          type: "string"
          enum: ["stable_external_key", "manual_binding", "exact_fingerprint"]
    OriginState:
      type: "string"
      enum: ["active", "stale", "conflict"]
    OriginAction:
      type: "string"
      enum: ["bind", "skip"]
    NodeOriginBinding:
      type: "object"
      additionalProperties: false
      required: ["binding_revision", "origin_state", "overridden_fields", "source_item_id", "source_resource_id", "match_method"]
      properties:
        binding_revision: { $ref: "#/components/schemas/Revision" }
        origin_state: { $ref: "#/components/schemas/OriginState" }
        overridden_fields:
          type: "array"
          minItems: 0
          maxItems: 64
          items: { $ref: "#/components/schemas/SafeFieldPath" }
        source_item_id: { $ref: "#/components/schemas/UUID" }
        source_resource_id: { $ref: "#/components/schemas/UUID" }
        match_method:
          type: "string"
          enum: ["stable_external_key", "manual_binding", "exact_fingerprint"]
    SourceItem:
      type: "object"
      additionalProperties: false
      required: ["id", "state", "name"]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        state:
          type: "string"
          enum: ["active", "missing", "conflict"]
        name: { $ref: "#/components/schemas/Name" }
        external_key:
          type: "string"
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:~-]+$'
        node_id: { $ref: "#/components/schemas/UUID" }
        suggested_node_id: { $ref: "#/components/schemas/UUID" }
    NodeCreate:
      type: "object"
      additionalProperties: false
      required: ["schema_version", "protocol", "endpoint", "auth", "transport", "security"]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        protocol: { $ref: "#/components/schemas/Protocol" }
        endpoint: { $ref: "#/components/schemas/Endpoint" }
        auth: { $ref: "#/components/schemas/NodeAuth" }
        transport: { $ref: "#/components/schemas/NodeTransport" }
        security: { $ref: "#/components/schemas/NodeSecurity" }
        features: { $ref: "#/components/schemas/NodeFeatures" }
        extensions: { $ref: "#/components/schemas/NodeExtensions" }
        origin: { $ref: "#/components/schemas/NodeOrigin" }
      allOf:
        -
          if:
            properties:
              protocol:
                const: "shadowsocks"
            required: ["protocol"]
          then:
            properties:
              auth: { $ref: "#/components/schemas/MethodPasswordAuth" }
              transport: { $ref: "#/components/schemas/NativeTCPTransport" }
              security: { $ref: "#/components/schemas/NoSecurity" }
        -
          if:
            properties:
              protocol:
                const: "vmess"
            required: ["protocol"]
          then:
            properties:
              auth: { $ref: "#/components/schemas/VMessAuth" }
              security:
                properties:
                  mode:
                    enum: ["none", "tls"]
        -
          if:
            properties:
              protocol:
                const: "vless"
            required: ["protocol"]
          then:
            properties:
              auth: { $ref: "#/components/schemas/UUIDAuth" }
        -
          if:
            properties:
              protocol:
                const: "trojan"
            required: ["protocol"]
          then:
            properties:
              auth: { $ref: "#/components/schemas/PasswordAuth" }
              security: { $ref: "#/components/schemas/TLSSecurity" }
        -
          if:
            properties:
              protocol:
                enum: ["socks5", "http"]
            required: ["protocol"]
          then:
            properties:
              auth:
                oneOf:
                  - { $ref: "#/components/schemas/NoAuth" }
                  - { $ref: "#/components/schemas/UsernamePasswordAuth" }
              transport: { $ref: "#/components/schemas/NativeTCPTransport" }
              security:
                properties:
                  mode:
                    enum: ["none", "tls"]
        -
          if:
            properties:
              security:
                properties:
                  mode:
                    const: "reality"
                required: ["mode"]
            required: ["security"]
          then:
            properties:
              protocol:
                const: "vless"
              transport: { $ref: "#/components/schemas/NativeTCPTransport" }
        -
          if:
            properties:
              features:
                required: ["protocol_variant"]
            required: ["features"]
          then:
            properties:
              protocol:
                const: "vless"
              transport: { $ref: "#/components/schemas/NativeTCPTransport" }
              security:
                properties:
                  mode:
                    enum: ["tls", "reality"]
      description: "Management creation DTO for typed IR v1. Optional features/extensions default to empty objects at the validated domain boundary. Structural acceptance never certifies a kernel combination."
    NodePatch:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        protocol: { $ref: "#/components/schemas/Protocol" }
        endpoint: { $ref: "#/components/schemas/Endpoint" }
        auth: { $ref: "#/components/schemas/NodeAuthPatch" }
        transport: { $ref: "#/components/schemas/NodeTransport" }
        security: { $ref: "#/components/schemas/NodeSecurityPatch" }
        features: { $ref: "#/components/schemas/NodeFeatures" }
      minProperties: 1
      description: "Only these typed fields are writable. Endpoint/transport/features are whole-object replacements; auth/security use the documented typed merge. No arbitrary merge-patch, scope, revision, epoch, origin or native dependency fields."
    NodeRedacted:
      type: "object"
      additionalProperties: false
      required: ["schema_version", "protocol", "endpoint", "auth", "transport", "security", "features", "extensions"]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        protocol: { $ref: "#/components/schemas/Protocol" }
        endpoint: { $ref: "#/components/schemas/Endpoint" }
        auth: { $ref: "#/components/schemas/NodeAuthRedacted" }
        transport: { $ref: "#/components/schemas/NodeTransport" }
        security: { $ref: "#/components/schemas/NodeSecurityRedacted" }
        features: { $ref: "#/components/schemas/NodeFeatures" }
        extensions: { $ref: "#/components/schemas/NodeExtensions" }
        origin: { $ref: "#/components/schemas/NodeOrigin" }
      description: "Dedicated management read DTO, never a serialized IR Node or Resource. Password, UUID, username, REALITY public_key and short_id are absent rather than masked."
      allOf:
        -
          if:
            properties:
              protocol:
                const: "shadowsocks"
            required: ["protocol"]
          then:
            properties:
              auth: { $ref: "#/components/schemas/MethodPasswordAuthRedacted" }
              transport: { $ref: "#/components/schemas/NativeTCPTransport" }
              security: { $ref: "#/components/schemas/NoSecurity" }
        -
          if:
            properties:
              protocol:
                const: "vmess"
            required: ["protocol"]
          then:
            properties:
              auth: { $ref: "#/components/schemas/VMessAuthRedacted" }
              security:
                properties:
                  mode:
                    enum: ["none", "tls"]
        -
          if:
            properties:
              protocol:
                const: "vless"
            required: ["protocol"]
          then:
            properties:
              auth: { $ref: "#/components/schemas/UUIDAuthRedacted" }
        -
          if:
            properties:
              protocol:
                const: "trojan"
            required: ["protocol"]
          then:
            properties:
              auth: { $ref: "#/components/schemas/PasswordAuthRedacted" }
              security: { $ref: "#/components/schemas/TLSSecurity" }
        -
          if:
            properties:
              protocol:
                enum: ["socks5", "http"]
            required: ["protocol"]
          then:
            properties:
              auth:
                oneOf:
                  - { $ref: "#/components/schemas/NoAuth" }
                  - { $ref: "#/components/schemas/UsernamePasswordAuthRedacted" }
              transport: { $ref: "#/components/schemas/NativeTCPTransport" }
              security:
                properties:
                  mode:
                    enum: ["none", "tls"]
        -
          if:
            properties:
              security:
                properties:
                  mode:
                    const: "reality"
                required: ["mode"]
            required: ["security"]
          then:
            properties:
              protocol:
                const: "vless"
              transport: { $ref: "#/components/schemas/NativeTCPTransport" }
        -
          if:
            properties:
              features:
                required: ["protocol_variant"]
            required: ["features"]
          then:
            properties:
              protocol:
                const: "vless"
              transport: { $ref: "#/components/schemas/NativeTCPTransport" }
              security:
                properties:
                  mode:
                    enum: ["tls", "reality"]
    NodeCloneRequest:
      type: "object"
      additionalProperties: false
      required: ["name"]
      properties:
        name: { $ref: "#/components/schemas/Name" }
      description: "Clone the If-Match source revision on the server with a new stable ID and revision 1; secrets never pass through a read response."
    NodeCreateRequest:
      type: "object"
      additionalProperties: false
      required: ["name", "node"]
      properties:
        name: { $ref: "#/components/schemas/Name" }
        tags: { $ref: "#/components/schemas/Tags" }
        enabled:
          type: "boolean"
        node: { $ref: "#/components/schemas/NodeCreate" }
    NodePatchRequest:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        name: { $ref: "#/components/schemas/Name" }
        tags: { $ref: "#/components/schemas/Tags" }
        enabled:
          type: "boolean"
        node: { $ref: "#/components/schemas/NodePatch" }
        binding_revision: { $ref: "#/components/schemas/Revision" }
        restore_fields:
          type: "array"
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/SafeFieldPath" }
        origin_action: { $ref: "#/components/schemas/OriginAction" }
        source_item_id: { $ref: "#/components/schemas/UUID" }
      minProperties: 1
      description: "Bound nodes write overlay fields, not the source baseline. Overlay, restore_fields and origin_action require binding_revision. Protocol cannot be overlaid."
    NodeResource:
      type: "object"
      additionalProperties: false
      required: ["metadata", "node"]
      properties:
        metadata:
          $ref: "#/components/schemas/ResourceMetadata"
          properties:
            kind:
              const: "node"
        node: { $ref: "#/components/schemas/NodeRedacted" }
        binding: { $ref: "#/components/schemas/NodeOriginBinding" }
    NodeReadResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/NodeResource" }
    NodeListResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data", "page"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data:
          type: "array"
          minItems: 0
          maxItems: 200
          items: { $ref: "#/components/schemas/NodeResource" }
        page: { $ref: "#/components/schemas/PageInfo" }
    NodeReveal:
      type: "object"
      additionalProperties: false
      required: ["resource_id", "revision", "auth", "security"]
      properties:
        resource_id: { $ref: "#/components/schemas/UUID" }
        revision: { $ref: "#/components/schemas/Revision" }
        auth: { $ref: "#/components/schemas/NodeAuth" }
        security: { $ref: "#/components/schemas/NodeSecurity" }
      description: "Explicit privileged one-time secret response. Excluded from ordinary read, audit, logging and idempotency storage. Not a complete IR Resource."
    NodeRevealResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/NodeReveal" }
    NodeRef:
      type: "object"
      additionalProperties: false
      required: ["node_id"]
      properties:
        node_id: { $ref: "#/components/schemas/UUID" }
    ChainHops:
      type: "array"
      minItems: 2
      maxItems: 2
      items: { $ref: "#/components/schemas/NodeRef" }
      uniqueItems: true
      description: "Ordered client perspective: first hop then final exit. Both IDs are distinct, concrete enabled nodes in the same scope. No fixed historical revisions."
    Chain:
      type: "object"
      additionalProperties: false
      required: ["schema_version", "hops", "failure_policy"]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        hops: { $ref: "#/components/schemas/ChainHops" }
        failure_policy:
          type: "string"
          const: "fail_closed"
    ChainCreateRequest:
      type: "object"
      additionalProperties: false
      required: ["name", "hops", "failure_policy"]
      description: "Create two distinct concrete node hops. The last hop is the exit. Editing a chain never rewrites the hop nodes."
      properties:
        name: { $ref: "#/components/schemas/Name" }
        hops: { $ref: "#/components/schemas/ChainHops" }
        failure_policy:
          type: "string"
          const: "fail_closed"
        tags: { $ref: "#/components/schemas/Tags" }
        enabled:
          type: "boolean"
    ChainPatchRequest:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        name: { $ref: "#/components/schemas/Name" }
        hops: { $ref: "#/components/schemas/ChainHops" }
        failure_policy:
          type: "string"
          const: "fail_closed"
        tags: { $ref: "#/components/schemas/Tags" }
        enabled:
          type: "boolean"
      minProperties: 1
    ChainResource:
      type: "object"
      additionalProperties: false
      required: ["metadata", "chain"]
      properties:
        metadata:
          $ref: "#/components/schemas/ResourceMetadata"
          properties:
            kind:
              const: "chain"
        chain: { $ref: "#/components/schemas/Chain" }
    ChainReadResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/ChainResource" }
    ChainListResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data", "page"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data:
          type: "array"
          minItems: 0
          maxItems: 200
          items: { $ref: "#/components/schemas/ChainResource" }
        page: { $ref: "#/components/schemas/PageInfo" }
    NodePrecondition:
      type: "object"
      additionalProperties: false
      required: ["node_id", "revision"]
      properties:
        node_id: { $ref: "#/components/schemas/UUID" }
        revision: { $ref: "#/components/schemas/Revision" }
    NodeBatchRequest:
      type: "object"
      additionalProperties: false
      required: ["operation", "node_ids", "preconditions"]
      properties:
        operation:
          type: "string"
          enum: ["add_tags", "remove_tags", "set_enabled"]
        node_ids:
          type: "array"
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/UUID" }
          uniqueItems: true
        preconditions:
          type: "array"
          minItems: 0
          maxItems: 200
          items: { $ref: "#/components/schemas/NodePrecondition" }
          uniqueItems: true
        tags: { $ref: "#/components/schemas/Tags" }
        enabled:
          type: "boolean"
      allOf:
        -
          if:
            properties:
              operation:
                enum: ["add_tags", "remove_tags"]
          then:
            required: ["tags"]
            not:
              required: ["enabled"]
        -
          if:
            properties:
              operation:
                const: "set_enabled"
          then:
            required: ["enabled"]
            not:
              required: ["tags"]
    NodeBatchItem:
      type: "object"
      additionalProperties: false
      required: ["node_id", "http_status"]
      properties:
        node_id: { $ref: "#/components/schemas/UUID" }
        http_status:
          type: "integer"
          enum: [200, 404, 409, 412, 422, 428]
        revision: { $ref: "#/components/schemas/Revision" }
        error: { $ref: "#/components/schemas/SafeError" }
      allOf:
        -
          if:
            properties:
              http_status:
                const: 200
          then:
            required: ["revision"]
            not:
              required: ["error"]
          else:
            required: ["error"]
    NodeBatchResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data:
          type: "array"
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/NodeBatchItem" }
    ResourceReference:
      type: "object"
      additionalProperties: false
      required: ["source_resource_id", "source_revision", "source_kind", "target_resource_id", "state", "field_path"]
      properties:
        source_resource_id: { $ref: "#/components/schemas/UUID" }
        source_revision: { $ref: "#/components/schemas/Revision" }
        source_kind: { $ref: "#/components/schemas/ResourceKind" }
        target_resource_id: { $ref: "#/components/schemas/UUID" }
        target_revision: { $ref: "#/components/schemas/Revision" }
        state:
          type: "string"
          enum: ["active", "historical"]
        field_path: { $ref: "#/components/schemas/SafeFieldPath" }
    ReferenceListResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data", "page"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data:
          type: "array"
          minItems: 0
          maxItems: 200
          items: { $ref: "#/components/schemas/ResourceReference" }
        page: { $ref: "#/components/schemas/PageInfo" }
    AuthUsername:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9._-]+$'
      description: Exact lowercase ASCII identifier; no implicit trimming or case conversion.
    AuthPassword:
      type: string
      minLength: 1
      maxLength: 1024
      x-sensitive: true
      description: UTF-8 password, at most 1024 bytes. New passwords require at least 12 bytes; domain violations return 422. Passwords are never normalized.
    SetupToken:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
      x-sensitive: true
      description: Canonical unpadded base64url encoding of 32 random bytes from the controlled host command.
    SetupRequest:
      type: "object"
      additionalProperties: false
      required: ["setup_token", "username", "password"]
      properties:
        setup_token: { $ref: "#/components/schemas/SetupToken" }
        username: { $ref: "#/components/schemas/AuthUsername" }
        password: { $ref: "#/components/schemas/AuthPassword" }
    LoginRequest:
      type: "object"
      additionalProperties: false
      required: ["username", "password"]
      properties:
        username: { $ref: "#/components/schemas/AuthUsername" }
        password: { $ref: "#/components/schemas/AuthPassword" }
    LogoutRequest:
      type: "object"
      additionalProperties: false
      maxProperties: 0
    ReauthenticationRequest:
      type: "object"
      additionalProperties: false
      required: ["password"]
      properties:
        password: { $ref: "#/components/schemas/AuthPassword" }
    CurrentUser:
      type: "object"
      additionalProperties: false
      required: ["user_id", "username", "role", "session_expires_at", "csrf_token"]
      properties:
        user_id: { $ref: "#/components/schemas/UUID" }
        username: { $ref: "#/components/schemas/AuthUsername" }
        role:
          type: "string"
          const: "administrator"
        session_expires_at: { $ref: "#/components/schemas/Timestamp" }
        recent_authentication_expires_at: { $ref: "#/components/schemas/Timestamp" }
        csrf_token:
          type: "string"
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          x-sensitive: true
          description: "Session-bound token for X-CSRF-Token. Keep in memory only; never an authorization substitute."
    SessionResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/CurrentUser" }
    ImportFormat:
      type: "string"
      enum: ["auto", "uri_list", "base64_uri_list", "xray_json", "singbox_json", "mihomo_yaml"]
    ImportCreateRequest:
      type: "object"
      additionalProperties: false
      required: ["text", "format"]
      properties:
        text:
          type: "string"
          minLength: 1
          maxLength: 10485760
          x-sensitive: true
          description: "Bounded source text; never logged. Parsing and decoded-size limits also apply."
        format: { $ref: "#/components/schemas/ImportFormat" }
        source_id: { $ref: "#/components/schemas/UUID" }
    ImportFileRequest:
      type: "object"
      additionalProperties: false
      required: ["file", "format"]
      properties:
        file:
          type: "string"
          format: "binary"
          maxLength: 10485760
          description: "Restricted file bytes only; the client filename is never a server filesystem path."
        format: { $ref: "#/components/schemas/ImportFormat" }
        source_id: { $ref: "#/components/schemas/UUID" }
    ImportAccepted:
      type: "object"
      additionalProperties: false
      required: ["batch_id", "job_id", "revision", "state"]
      properties:
        batch_id: { $ref: "#/components/schemas/UUID" }
        job_id: { $ref: "#/components/schemas/UUID" }
        revision: { $ref: "#/components/schemas/Revision" }
        state:
          type: "string"
          enum: ["queued", "parsing"]
    ImportAcceptedResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/ImportAccepted" }
    SourceFieldChange:
      type: "object"
      additionalProperties: false
      required: ["field_path"]
      properties:
        field_path: { $ref: "#/components/schemas/SafeFieldPath" }
        secret_changed:
          type: "boolean"
          const: true
        before: {}
        after: {}
      allOf:
        - if:
            required: ["secret_changed"]
          then:
            not:
              anyOf:
                - required: ["before"]
                - required: ["after"]
      description: "Only typed node/name field paths. Secret changes expose no before or after values."
    ImportCandidate:
      type: "object"
      additionalProperties: false
      required: ["candidate_id", "index", "state", "diagnostics"]
      properties:
        candidate_id: { $ref: "#/components/schemas/UUID" }
        index:
          type: "integer"
          minimum: 0
          maximum: 99999
        state:
          type: "string"
          enum: ["new", "matched", "conflict", "invalid"]
        name: { $ref: "#/components/schemas/Name" }
        node: { $ref: "#/components/schemas/NodeRedacted" }
        existing_resource_id: { $ref: "#/components/schemas/UUID" }
        existing_revision: { $ref: "#/components/schemas/Revision" }
        source_item_id: { $ref: "#/components/schemas/UUID" }
        change_kind:
          type: "string"
          enum: ["new", "modified", "missing", "conflict", "unchanged"]
        auto_applied:
          type: "boolean"
        binding_revision: { $ref: "#/components/schemas/Revision" }
        upstream_changes:
          type: "array"
          items: { $ref: "#/components/schemas/SourceFieldChange" }
        effective_changes:
          type: "array"
          items: { $ref: "#/components/schemas/SourceFieldChange" }
        match_method:
          type: "string"
          enum: ["stable_external_key", "manual_binding", "exact_fingerprint", "suggestion"]
        changed_fields:
          type: "array"
          minItems: 0
          maxItems: 64
          items: { $ref: "#/components/schemas/SafeFieldPath" }
        diagnostics: { $ref: "#/components/schemas/Diagnostics" }
    ImportBatch:
      type: "object"
      additionalProperties: false
      required: ["batch_id", "revision", "job_id", "state", "candidate_count", "candidates", "created_at", "expires_at", "diagnostics"]
      properties:
        batch_id: { $ref: "#/components/schemas/UUID" }
        revision: { $ref: "#/components/schemas/Revision" }
        job_id: { $ref: "#/components/schemas/UUID" }
        state:
          type: "string"
          enum: ["queued", "parsing", "ready", "failed", "committed", "expired", "superseded"]
        source_id: { $ref: "#/components/schemas/UUID" }
        snapshot_id: { $ref: "#/components/schemas/UUID" }
        source_revision: { $ref: "#/components/schemas/Revision" }
        binding_revision: { $ref: "#/components/schemas/Revision" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        candidate_count:
          type: "integer"
          minimum: 0
          maximum: 100000
        candidates:
          type: "array"
          minItems: 0
          maxItems: 200
          items: { $ref: "#/components/schemas/ImportCandidate" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        diagnostics: { $ref: "#/components/schemas/Diagnostics" }
    ImportResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data", "page"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/ImportBatch" }
        page: { $ref: "#/components/schemas/PageInfo" }
    ImportDecision:
      type: "object"
      additionalProperties: false
      required: ["candidate_id", "action"]
      properties:
        candidate_id: { $ref: "#/components/schemas/UUID" }
        action:
          type: "string"
          enum: ["create", "update", "skip", "bind"]
        resource_id: { $ref: "#/components/schemas/UUID" }
        expected_revision: { $ref: "#/components/schemas/Revision" }
        expected_binding_revision: { $ref: "#/components/schemas/Revision" }
        override: { $ref: "#/components/schemas/NodePatchRequest" }
      allOf:
        -
          if:
            properties:
              action:
                enum: ["update", "bind"]
          then:
            required: ["resource_id", "expected_revision"]
        -
          if:
            properties:
              action:
                enum: ["create", "skip"]
          then:
            not:
              anyOf:
                -
                  required: ["resource_id"]
                -
                  required: ["expected_revision"]
    ImportCommitRequest:
      type: "object"
      additionalProperties: false
      required: ["decisions"]
      properties:
        decisions:
          type: "array"
          minItems: 1
          maxItems: 5000
          items: { $ref: "#/components/schemas/ImportDecision" }
        source_revision: { $ref: "#/components/schemas/Revision" }
        binding_revision: { $ref: "#/components/schemas/Revision" }
      description: "The preview ETag is supplied in If-Match. Source-backed commits require source_revision and each bound decision's expected_binding_revision. Top-level binding_revision remains reserved and rejected. New successful refreshes or source edits supersede pending previews. Selected writes and bindings are atomic and idempotent; confirmation never fetches the source again."
    ImportCommitItem:
      type: "object"
      additionalProperties: false
      required: ["candidate_id", "status"]
      properties:
        candidate_id: { $ref: "#/components/schemas/UUID" }
        status:
          type: "string"
          enum: ["created", "updated", "skipped", "bound"]
        resource_id: { $ref: "#/components/schemas/UUID" }
        revision: { $ref: "#/components/schemas/Revision" }
    ImportCommit:
      type: "object"
      additionalProperties: false
      required: ["batch_id", "revision", "items"]
      properties:
        batch_id: { $ref: "#/components/schemas/UUID" }
        revision: { $ref: "#/components/schemas/Revision" }
        items:
          type: "array"
          minItems: 1
          maxItems: 5000
          items: { $ref: "#/components/schemas/ImportCommitItem" }
    ImportCommitResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/ImportCommit" }
    HTTPSURL:
      type: "string"
      format: "uri"
      maxLength: 2048
      pattern: "^https://[^\\s@#]+$"
      description: "HTTPS only; URL parser must additionally reject userinfo, fragments, invalid ports and unsafe addresses. Every resolution, redirect and connection requires SafeFetcher validation. Not a standalone SSRF guarantee."
    SourceURL:
      type: "string"
      format: "uri"
      maxLength: 4096
      pattern: "^https?://[^\\s#]+$"
      x-sensitive: true
      description: "Raw source URL may contain subscription credentials. Encrypt it and return only the sanitized display form; never log it."
    SourceNoAuth:
      type: "object"
      additionalProperties: false
      required: ["kind"]
      properties:
        kind:
          type: "string"
          const: "none"
    SourceBearerAuth:
      type: "object"
      additionalProperties: false
      required: ["kind", "token"]
      properties:
        kind:
          type: "string"
          const: "bearer"
        token: { $ref: "#/components/schemas/Secret" }
    SourceBasicAuth:
      type: "object"
      additionalProperties: false
      required: ["kind", "username", "password"]
      properties:
        kind:
          type: "string"
          const: "basic"
        username: { $ref: "#/components/schemas/Secret" }
        password: { $ref: "#/components/schemas/Secret" }
    SourceAuth:
      oneOf:
        - { $ref: "#/components/schemas/SourceNoAuth" }
        - { $ref: "#/components/schemas/SourceBearerAuth" }
        - { $ref: "#/components/schemas/SourceBasicAuth" }
    SourceBearerAuthPatch:
      type: "object"
      additionalProperties: false
      required: ["kind"]
      properties:
        kind:
          type: "string"
          const: "bearer"
        token: { $ref: "#/components/schemas/SecretPatch" }
    SourceBasicAuthPatch:
      type: "object"
      additionalProperties: false
      required: ["kind"]
      properties:
        kind:
          type: "string"
          const: "basic"
        username: { $ref: "#/components/schemas/SecretPatch" }
        password: { $ref: "#/components/schemas/SecretPatch" }
    SourceAuthPatch:
      oneOf:
        - { $ref: "#/components/schemas/SourceNoAuth" }
        - { $ref: "#/components/schemas/SourceBearerAuthPatch" }
        - { $ref: "#/components/schemas/SourceBasicAuthPatch" }
    SourceBearerAuthRedacted:
      type: "object"
      additionalProperties: false
      required: ["kind", "has_token"]
      properties:
        kind:
          type: "string"
          const: "bearer"
        has_token:
          type: "boolean"
    SourceBasicAuthRedacted:
      type: "object"
      additionalProperties: false
      required: ["kind", "has_username", "has_password"]
      properties:
        kind:
          type: "string"
          const: "basic"
        has_username:
          type: "boolean"
        has_password:
          type: "boolean"
    SourceAuthRedacted:
      oneOf:
        - { $ref: "#/components/schemas/SourceNoAuth" }
        - { $ref: "#/components/schemas/SourceBearerAuthRedacted" }
        - { $ref: "#/components/schemas/SourceBasicAuthRedacted" }
    SourceRefreshPolicy:
      type: "object"
      additionalProperties: false
      required: ["enabled", "interval_seconds", "commit_mode", "missing_policy"]
      properties:
        enabled:
          type: "boolean"
        interval_seconds:
          type: "integer"
          minimum: 60
          maximum: 2592000
        commit_mode:
          type: "string"
          enum: ["manual", "safe_updates"]
        missing_policy:
          type: "string"
          enum: ["retain", "disable"]
    SourceFetchLimits:
      type: "object"
      additionalProperties: false
      required: ["timeout_ms", "max_compressed_bytes", "max_decoded_bytes", "max_redirects"]
      properties:
        timeout_ms:
          type: "integer"
          minimum: 1000
          maximum: 60000
        max_compressed_bytes:
          type: "integer"
          minimum: 1
          maximum: 10485760
        max_decoded_bytes:
          type: "integer"
          minimum: 1
          maximum: 10485760
        max_redirects:
          type: "integer"
          minimum: 0
          maximum: 5
    SourceWrite:
      type: "object"
      additionalProperties: false
      required: ["schema_version", "url", "format", "auth", "refresh_policy", "fetch_limits"]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        url: { $ref: "#/components/schemas/SourceURL" }
        format: { $ref: "#/components/schemas/ImportFormat" }
        auth: { $ref: "#/components/schemas/SourceAuth" }
        refresh_policy: { $ref: "#/components/schemas/SourceRefreshPolicy" }
        fetch_limits: { $ref: "#/components/schemas/SourceFetchLimits" }
    SourcePatch:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        url:
          anyOf:
            - { $ref: "#/components/schemas/SourceURL" }
            -
              type: "null"
        format: { $ref: "#/components/schemas/ImportFormat" }
        auth: { $ref: "#/components/schemas/SourceAuthPatch" }
        refresh_policy: { $ref: "#/components/schemas/SourceRefreshPolicy" }
        fetch_limits: { $ref: "#/components/schemas/SourceFetchLimits" }
      minProperties: 1
      description: "Absent secrets preserve, null clears and strings replace. A source still requires a URL and complete selected authentication; clearing required values is 422 after typed merge."
    SourceRedacted:
      type: "object"
      additionalProperties: false
      required: ["schema_version", "url_display", "has_url", "format", "auth", "refresh_policy", "fetch_limits", "binding_revision"]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        url_display:
          type: "string"
          minLength: 1
          maxLength: 2048
          format: "uri"
          pattern: "^https?://[^/?#@\\s]+$"
          description: "Only scheme and authority (host and optional port). Every path, query, userinfo and fragment is omitted because an unrecognized path segment may itself be a subscription credential. Never the original source URL."
        has_url:
          type: "boolean"
        format: { $ref: "#/components/schemas/ImportFormat" }
        auth: { $ref: "#/components/schemas/SourceAuthRedacted" }
        refresh_policy: { $ref: "#/components/schemas/SourceRefreshPolicy" }
        fetch_limits: { $ref: "#/components/schemas/SourceFetchLimits" }
        binding_revision: { $ref: "#/components/schemas/Revision" }
        last_success_at: { $ref: "#/components/schemas/Timestamp" }
        last_job_id: { $ref: "#/components/schemas/UUID" }
        latest_preview_batch_id: { $ref: "#/components/schemas/UUID" }
        last_error: { $ref: "#/components/schemas/SafeError" }
    SourceCreateRequest:
      type: "object"
      additionalProperties: false
      required: ["name", "source"]
      properties:
        name: { $ref: "#/components/schemas/Name" }
        tags: { $ref: "#/components/schemas/Tags" }
        enabled:
          type: "boolean"
        source: { $ref: "#/components/schemas/SourceWrite" }
      description: "Creates an encrypted source revision. Ordinary GET responses return only url_display and authentication presence; the raw URL and secrets stay on the refresh execution path."
    SourcePatchRequest:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        name: { $ref: "#/components/schemas/Name" }
        tags: { $ref: "#/components/schemas/Tags" }
        enabled:
          type: "boolean"
        source: { $ref: "#/components/schemas/SourcePatch" }
      minProperties: 1
    SourceResource:
      type: "object"
      additionalProperties: false
      required: ["metadata", "source"]
      properties:
        metadata:
          $ref: "#/components/schemas/ResourceMetadata"
          properties:
            kind:
              const: "source"
        source: { $ref: "#/components/schemas/SourceRedacted" }
        items:
          type: "array"
          minItems: 0
          maxItems: 5000
          items: { $ref: "#/components/schemas/SourceItem" }
      description: "List responses omit items. A single GET includes current source items without secrets."
    SourceResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/SourceResource" }
    SourceListResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data", "page"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data:
          type: "array"
          minItems: 0
          maxItems: 200
          items: { $ref: "#/components/schemas/SourceResource" }
        page: { $ref: "#/components/schemas/PageInfo" }
    MemberRef:
      type: "object"
      additionalProperties: false
      required: ["type", "kind", "resource_id"]
      properties:
        type:
          type: "string"
          const: "resource_ref"
        kind:
          type: "string"
          enum: ["node", "chain"]
        resource_id: { $ref: "#/components/schemas/UUID" }
    RoutingResourceRef:
      type: "object"
      additionalProperties: false
      required: ["type", "kind", "resource_id"]
      properties:
        type:
          type: "string"
          const: "resource_ref"
        kind:
          type: "string"
          enum: ["node", "chain", "policy_group"]
        resource_id: { $ref: "#/components/schemas/UUID" }
    BuiltinRef:
      type: "object"
      additionalProperties: false
      required: ["type", "builtin"]
      properties:
        type:
          type: "string"
          const: "builtin"
        builtin:
          type: "string"
          enum: ["direct", "reject"]
    TargetRef:
      oneOf:
        - { $ref: "#/components/schemas/RoutingResourceRef" }
        - { $ref: "#/components/schemas/BuiltinRef" }
    PolicyStrategy:
      type: "string"
      enum: ["fixed", "manual_select", "latency_best", "round_robin"]
    PolicyHealthCheck:
      type: "object"
      additionalProperties: false
      required: ["enabled"]
      properties:
        enabled:
          type: "boolean"
        url: { $ref: "#/components/schemas/HTTPSURL" }
        interval_ms:
          type: "integer"
          minimum: 1000
          maximum: 86400000
        timeout_ms:
          type: "integer"
          minimum: 100
          maximum: 60000
        tolerance_ms:
          type: "integer"
          minimum: 0
          maximum: 60000
      description: "Explicit client runtime observation, independent of platform background tests. If enabled, URL, interval, timeout and tolerance are all required. Unsupported target behavior blocks publication."
      allOf:
        -
          if:
            properties:
              enabled:
                const: true
          then:
            required: ["url", "interval_ms", "timeout_ms", "tolerance_ms"]
    PolicyGroup:
      type: "object"
      additionalProperties: false
      required: ["schema_version", "strategy", "members", "default_member", "health_check", "on_unavailable"]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        strategy: { $ref: "#/components/schemas/PolicyStrategy" }
        members:
          type: "array"
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/MemberRef" }
          uniqueItems: true
        default_member: { $ref: "#/components/schemas/MemberRef" }
        health_check: { $ref: "#/components/schemas/PolicyHealthCheck" }
        on_unavailable:
          type: "string"
          const: "fail_closed"
      description: "default_member must be one of members. P0 never nests groups or inserts direct. fixed selects at publication time; manual_select selects in the client."
    PolicyGroupPatch:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        strategy: { $ref: "#/components/schemas/PolicyStrategy" }
        members:
          type: "array"
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/MemberRef" }
          uniqueItems: true
        default_member: { $ref: "#/components/schemas/MemberRef" }
        health_check: { $ref: "#/components/schemas/PolicyHealthCheck" }
        on_unavailable:
          type: "string"
          const: "fail_closed"
      minProperties: 1
    PolicyGroupCreateRequest:
      type: "object"
      additionalProperties: false
      required: ["name", "policy_group"]
      properties:
        name: { $ref: "#/components/schemas/Name" }
        tags: { $ref: "#/components/schemas/Tags" }
        enabled:
          type: "boolean"
        policy_group: { $ref: "#/components/schemas/PolicyGroup" }
    PolicyGroupPatchRequest:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        name: { $ref: "#/components/schemas/Name" }
        tags: { $ref: "#/components/schemas/Tags" }
        enabled:
          type: "boolean"
        policy_group: { $ref: "#/components/schemas/PolicyGroupPatch" }
      minProperties: 1
    PolicyGroupResource:
      type: "object"
      additionalProperties: false
      required: ["metadata", "policy_group", "diagnostics"]
      properties:
        metadata:
          $ref: "#/components/schemas/ResourceMetadata"
          properties:
            kind:
              const: "policy_group"
        policy_group: { $ref: "#/components/schemas/PolicyGroup" }
        diagnostics: { $ref: "#/components/schemas/Diagnostics" }
    PolicyGroupResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/PolicyGroupResource" }
    PolicyGroupListResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data", "page"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data:
          type: "array"
          minItems: 0
          maxItems: 200
          items: { $ref: "#/components/schemas/PolicyGroupResource" }
        page: { $ref: "#/components/schemas/PageInfo" }
    DomainName:
      type: "string"
      format: "hostname"
      maxLength: 253
      pattern: "^[a-z0-9][a-z0-9.-]*$"
      description: "Normalized lowercase IDNA ASCII domain. Suffix match includes the domain itself and dot-delimited subdomains."
    CIDR:
      type: "string"
      maxLength: 64
      pattern: "^[0-9a-fA-F:.]+/(?:[0-9]|[1-9][0-9]|1[01][0-9]|12[0-8])$"
      description: "Canonical IPv4 or IPv6 network CIDR. Domain validation additionally parses the address, checks family prefix bounds and host bits."
    PortRange:
      type: "object"
      additionalProperties: false
      required: ["from", "to"]
      properties:
        from:
          type: "integer"
          minimum: 1
          maximum: 65535
        to:
          type: "integer"
          minimum: 1
          maximum: 65535
      description: "Inclusive range; from must be <= to."
    DomainMatch:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        domain_exact:
          type: "array"
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/DomainName" }
          uniqueItems: true
        domain_suffix:
          type: "array"
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/DomainName" }
          uniqueItems: true
        rule_set_ids:
          type: "array"
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/UUID" }
          uniqueItems: true
      minProperties: 1
    RouteMatch:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        domain_exact:
          type: "array"
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/DomainName" }
          uniqueItems: true
        domain_suffix:
          type: "array"
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/DomainName" }
          uniqueItems: true
        rule_set_ids:
          type: "array"
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/UUID" }
          uniqueItems: true
        ip_cidrs:
          type: "array"
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/CIDR" }
          uniqueItems: true
        destination_ports:
          type: "array"
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/PortRange" }
        network:
          type: "array"
          minItems: 1
          maxItems: 2
          items:
            type: "string"
            enum: ["tcp", "udp"]
          uniqueItems: true
      minProperties: 1
      description: "Different fields AND; entries in the same field OR. No arbitrary expression, regular-expression engine, native rule string or general NOT. Rule-set revisions freeze during compilation."
    RoutingRule:
      type: "object"
      additionalProperties: false
      required: ["match", "action", "enabled", "comment"]
      properties:
        match: { $ref: "#/components/schemas/RouteMatch" }
        action: { $ref: "#/components/schemas/TargetRef" }
        enabled:
          type: "boolean"
        comment:
          type: "string"
          maxLength: 500
          pattern: "^[^\\x00-\\x1f\\x7f]*$"
    DomainResolutionMode:
      type: "string"
      enum: ["preserve_domain", "resolve_for_ip_rules"]
    RoutingProfile:
      type: "object"
      additionalProperties: false
      required: ["schema_version", "rules", "final", "domain_resolution_mode"]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        rules:
          type: "array"
          minItems: 0
          maxItems: 1000
          items: { $ref: "#/components/schemas/RoutingRule" }
        final: { $ref: "#/components/schemas/TargetRef" }
        domain_resolution_mode: { $ref: "#/components/schemas/DomainResolutionMode" }
      description: "Rules keep array order and first match wins. preserve_domain never resolves a domain just for IP matching; resolve_for_ip_rules resolves through the explicit DNS profile. Non-equivalent target semantics fail compilation."
    RoutingProfilePatch:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        rules:
          type: "array"
          minItems: 0
          maxItems: 1000
          items: { $ref: "#/components/schemas/RoutingRule" }
        final: { $ref: "#/components/schemas/TargetRef" }
        domain_resolution_mode: { $ref: "#/components/schemas/DomainResolutionMode" }
