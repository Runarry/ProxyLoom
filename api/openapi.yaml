        match: { $ref: "#/components/schemas/DomainMatch" }
        resolver_id: { $ref: "#/components/schemas/TargetKey" }
        enabled:
          type: "boolean"
        comment:
          type: "string"
          maxLength: 500
          pattern: "^[^\\x00-\\x1f\\x7f]*$"
    DNSProfile:
      type: "object"
      additionalProperties: false
      required: ["schema_version", "bootstrap", "resolvers", "rules", "final_resolver"]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        bootstrap:
          type: "array"
          minItems: 1
          maxItems: 32
