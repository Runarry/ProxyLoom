          minItems: 0
          maxItems: 1000
          items: { $ref: "#/components/schemas/DNSRule" }
        final_resolver: { $ref: "#/components/schemas/TargetKey" }
      description: "Resolver IDs are unique stable local keys, not names. final_resolver and each rule refer to a declared resolver. Bootstrap, resolver and outbound references are checked together for cycles. FakeIP and arbitrary native DNS options are outside P0."
    DNSProfilePatch:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        bootstrap:
          type: "array"
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/BootstrapResolver" }
        resolvers:
          type: "array"
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/DNSResolver" }
        rules:
          type: "array"
          minItems: 0
          maxItems: 1000
          items: { $ref: "#/components/schemas/DNSRule" }
        final_resolver: { $ref: "#/components/schemas/TargetKey" }
