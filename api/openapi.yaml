      minProperties: 2
      description: "Only reviewed strategy fields; never override member identity, authentication, dependency checks or fail_closed."
    ClientParameterOverride:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        local_port:
          type: "integer"
          minimum: 1
          maximum: 65535
        control_api_enabled:
          type: "boolean"
      minProperties: 1
      description: "Whitelist constrained further by the frozen approved preset; cannot add arbitrary native settings, listeners, credentials or scripts."
    SubscriptionTarget:
      type: "object"
      additionalProperties: false
      required: ["key", "core_build_id", "client_preset_id", "format", "policy_overrides"]
      properties:
        key: { $ref: "#/components/schemas/TargetKey" }
        core_build_id: { $ref: "#/components/schemas/UUID" }
        client_preset_id: { $ref: "#/components/schemas/UUID" }
        format: { $ref: "#/components/schemas/OutputFormat" }
        policy_overrides:
          type: "array"
          minItems: 0
          maxItems: 200
          items: { $ref: "#/components/schemas/PolicyOverride" }
        client_parameters: { $ref: "#/components/schemas/ClientParameterOverride" }
        enabled:
          type: "boolean"
      description: "Unique stable key. Omitted enabled means true. Compilation freezes the exact registered core digest and preset revision. Every enabled target must pass real native validation before atomic publication."
    ConnectivityPublishGate:
      type: "object"
      additionalProperties: false
      required: ["test_target_id", "max_age_seconds", "subject_policy", "required_verdict"]
      properties:
        test_target_id: { $ref: "#/components/schemas/UUID" }
        max_age_seconds:
          type: "integer"
          minimum: 1
          maximum: 86400
        subject_policy:
          type: "string"
          enum: ["all_members", "all_chains"]
        required_verdict:
          type: "string"
          const: "pass"
    SubscriptionProfile:
      type: "object"
      additionalProperties: false
      required: ["schema_version", "members", "routing_profile_id", "dns_profile_id", "targets", "publish_policy"]
      properties:
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        members: { $ref: "#/components/schemas/SubscriptionMembers" }
        routing_profile_id: { $ref: "#/components/schemas/UUID" }
        dns_profile_id: { $ref: "#/components/schemas/UUID" }
        targets:
          type: "array"
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/SubscriptionTarget" }
        publish_policy:
          type: "string"
          const: "strict_all_targets"
        connectivity_gate: { $ref: "#/components/schemas/ConnectivityPublishGate" }
    SubscriptionProfilePatch:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        members: { $ref: "#/components/schemas/SubscriptionMembers" }
        routing_profile_id: { $ref: "#/components/schemas/UUID" }
        dns_profile_id: { $ref: "#/components/schemas/UUID" }
        targets:
          type: "array"
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/SubscriptionTarget" }
        publish_policy:
          type: "string"
          const: "strict_all_targets"
        connectivity_gate: { $ref: "#/components/schemas/ConnectivityPublishGate" }
      minProperties: 1
    SubscriptionCreateRequest:
      type: "object"
      additionalProperties: false
      required: ["name", "subscription"]
      properties:
        name: { $ref: "#/components/schemas/Name" }
        tags: { $ref: "#/components/schemas/Tags" }
        enabled:
          type: "boolean"
        subscription: { $ref: "#/components/schemas/SubscriptionProfile" }
    SubscriptionPatchRequest:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        name: { $ref: "#/components/schemas/Name" }
        tags: { $ref: "#/components/schemas/Tags" }
        enabled:
          type: "boolean"
        subscription: { $ref: "#/components/schemas/SubscriptionProfilePatch" }
      minProperties: 1
    SubscriptionResource:
      type: "object"
      additionalProperties: false
      required: ["metadata", "subscription", "publication_head"]
      properties:
        metadata:
          $ref: "#/components/schemas/ResourceMetadata"
          properties:
            kind:
              const: "subscription_profile"
        subscription: { $ref: "#/components/schemas/SubscriptionProfile" }
        publication_head: { $ref: "#/components/schemas/PublicationHead" }
    PublicationHead:
      type: "object"
      additionalProperties: false
      required: ["generation", "state", "blocking_reasons"]
      properties:
        generation: { $ref: "#/components/schemas/Counter" }
        publication_id: { $ref: "#/components/schemas/UUID" }
        state:
          type: "string"
          enum: ["not_ready", "active", "blocked"]
        blocking_reasons: { $ref: "#/components/schemas/Diagnostics" }
    SubscriptionResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/SubscriptionResource" }
    SubscriptionListResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data", "page"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data:
          type: "array"
          minItems: 0
          maxItems: 200
          items: { $ref: "#/components/schemas/SubscriptionResource" }
        page: { $ref: "#/components/schemas/PageInfo" }
    CompileRequest:
      type: "object"
      additionalProperties: false
      required: ["target_keys"]
      properties:
        target_keys:
          type: "array"
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/TargetKey" }
          uniqueItems: true
      description: "The set must equal all enabled profile targets for a publishable strict_all_targets batch. Expected profile revision is supplied only through If-Match. No floating native input or client-supplied frozen metadata."
    PublicationDependency:
      type: "object"
      additionalProperties: false
      required: ["resource_id", "kind", "revision", "security_epoch", "inclusion", "required_by", "credential_categories"]
      properties:
        resource_id: { $ref: "#/components/schemas/UUID" }
        kind: { $ref: "#/components/schemas/ResourceKind" }
        revision: { $ref: "#/components/schemas/Revision" }
        security_epoch: { $ref: "#/components/schemas/Revision" }
        inclusion:
          type: "string"
          enum: ["explicit", "automatic"]
        required_by:
          type: "array"
          minItems: 0
          maxItems: 200
          items: { $ref: "#/components/schemas/UUID" }
          uniqueItems: true
        credential_categories:
          type: "array"
          minItems: 0
          maxItems: 5
          items:
            type: "string"
            enum: ["password", "uuid", "username", "reality_public_key", "reality_short_id"]
          uniqueItems: true
    CompileOutputSummary:
      type: "object"
      additionalProperties: false
      required: ["target_key", "core_build_id", "core_build_sha256", "adapter_version", "client_preset_id", "client_preset_revision", "format", "state", "diagnostics"]
      properties:
        target_key: { $ref: "#/components/schemas/TargetKey" }
        core_build_id: { $ref: "#/components/schemas/UUID" }
        core_build_sha256: { $ref: "#/components/schemas/SHA256" }
        adapter_version: { $ref: "#/components/schemas/ShortText" }
        client_preset_id: { $ref: "#/components/schemas/UUID" }
        client_preset_revision: { $ref: "#/components/schemas/Revision" }
        format: { $ref: "#/components/schemas/OutputFormat" }
        state:
          type: "string"
          enum: ["queued", "compiling", "validating", "ready", "failed"]
        artifact_id: { $ref: "#/components/schemas/UUID" }
        validation_job_id: { $ref: "#/components/schemas/UUID" }
        validation_verdict:
          type: "string"
          enum: ["pass", "fail", "inconclusive"]
        diagnostics: { $ref: "#/components/schemas/Diagnostics" }
    CompileBatch:
      type: "object"
      additionalProperties: false
      required: ["batch_id", "revision", "subscription_id", "subscription_revision", "catalog_revision", "state", "job_ids", "dependencies", "outputs", "diagnostics", "created_at"]
      properties:
        batch_id: { $ref: "#/components/schemas/UUID" }
        revision: { $ref: "#/components/schemas/Revision" }
        subscription_id: { $ref: "#/components/schemas/UUID" }
        subscription_revision: { $ref: "#/components/schemas/Revision" }
        catalog_revision: { $ref: "#/components/schemas/Revision" }
        state:
          type: "string"
          enum: ["queued", "compiling", "validating", "ready", "failed", "obsolete"]
        job_ids:
          type: "array"
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/UUID" }
          uniqueItems: true
        effective_preview_hash: { $ref: "#/components/schemas/SHA256" }
        dependencies:
          type: "array"
          minItems: 0
          maxItems: 10000
          items: { $ref: "#/components/schemas/PublicationDependency" }
        outputs:
          type: "array"
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/CompileOutputSummary" }
        diagnostics: { $ref: "#/components/schemas/Diagnostics" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
      description: "Safe preview only. effective_preview_hash is present once the full effective dependency/target preview is frozen. It identifies exactly what the actor must confirm; no raw credentials, full IR or native output."
    CompileBatchResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/CompileBatch" }
    PublicationConfirmation:
      type: "object"
      additionalProperties: false
      required: ["acknowledged"]
      properties:
        acknowledged:
          type: "boolean"
          const: true
      description: "Explicit user acknowledgement. The server must also possess and verify a confirmation tied to its authenticated current actor, the request batch_id and effective_preview_hash. This field alone is not proof or authorization; actor ID cannot be nominated by the client."
    PublishRequest:
      type: "object"
      additionalProperties: false
      required: ["batch_id", "expected_generation", "effective_preview_hash", "confirmation"]
      properties:
        batch_id: { $ref: "#/components/schemas/UUID" }
        expected_generation: { $ref: "#/components/schemas/Counter" }
        effective_preview_hash: { $ref: "#/components/schemas/SHA256" }
        confirmation: { $ref: "#/components/schemas/PublicationConfirmation" }
    RollbackRequest:
      type: "object"
      additionalProperties: false
      required: ["publication_id", "expected_generation"]
      properties:
        publication_id: { $ref: "#/components/schemas/UUID" }
        expected_generation: { $ref: "#/components/schemas/Counter" }
    PublishedTarget:
      type: "object"
      additionalProperties: false
      required: ["target_key", "artifact_id", "core_build_id", "core_build_sha256", "client_preset_id", "client_preset_revision", "format", "validation_job_id"]
      properties:
        target_key: { $ref: "#/components/schemas/TargetKey" }
        artifact_id: { $ref: "#/components/schemas/UUID" }
        core_build_id: { $ref: "#/components/schemas/UUID" }
        core_build_sha256: { $ref: "#/components/schemas/SHA256" }
        client_preset_id: { $ref: "#/components/schemas/UUID" }
        client_preset_revision: { $ref: "#/components/schemas/Revision" }
        format: { $ref: "#/components/schemas/OutputFormat" }
        validation_job_id: { $ref: "#/components/schemas/UUID" }
    Publication:
      type: "object"
      additionalProperties: false
      required: ["publication_id", "subscription_id", "generation", "batch_id", "created_at", "created_by", "state", "targets", "dependencies", "blocking_reasons"]
      properties:
        publication_id: { $ref: "#/components/schemas/UUID" }
        subscription_id: { $ref: "#/components/schemas/UUID" }
        generation: { $ref: "#/components/schemas/Revision" }
        batch_id: { $ref: "#/components/schemas/UUID" }
        source_publication_id: { $ref: "#/components/schemas/UUID" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        created_by: { $ref: "#/components/schemas/UUID" }
        state:
          type: "string"
          enum: ["active", "historical", "blocked"]
        targets:
          type: "array"
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/PublishedTarget" }
        dependencies:
          type: "array"
          minItems: 1
          maxItems: 10000
          items: { $ref: "#/components/schemas/PublicationDependency" }
        blocking_reasons: { $ref: "#/components/schemas/Diagnostics" }
      description: "Immutable publish record; state and blocking reasons are current safe projections. Rollback adds a new generation and source_publication_id instead of mutating old output."
    PublicationResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/Publication" }
    PublicationListResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data", "page"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data:
          type: "array"
          minItems: 0
          maxItems: 200
          items: { $ref: "#/components/schemas/Publication" }
        page: { $ref: "#/components/schemas/PageInfo" }
    SubscriptionToken:
      type: "string"
      minLength: 49
      maxLength: 128
      pattern: "^sub_[A-Za-z0-9_-]{1,64}\\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
      x-sensitive: true
      description: "sub_<public_id>.<base64url 32 random bytes>. Public ID only locates a verification record; all authority comes from live database checks. Never log this path value."
    TokenCreateRequest:
      type: "object"
      additionalProperties: false
      required: ["name", "allowed_targets"]
      properties:
        name: { $ref: "#/components/schemas/Name" }
        allowed_targets:
          type: "array"
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/TargetKey" }
          uniqueItems: true
        expires_at: { $ref: "#/components/schemas/Timestamp" }
      description: "Expiry omitted means no configured expiry, subject to system policy. Target keys are checked at issuance and on every download. Token creation has no resource If-Match."
    TokenMetadata:
      type: "object"
      additionalProperties: false
      required: ["token_id", "subscription_id", "revision", "name", "allowed_targets", "created_at", "state"]
      properties:
        token_id: { $ref: "#/components/schemas/UUID" }
        subscription_id: { $ref: "#/components/schemas/UUID" }
        revision: { $ref: "#/components/schemas/Revision" }
        name: { $ref: "#/components/schemas/Name" }
        allowed_targets:
          type: "array"
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/TargetKey" }
          uniqueItems: true
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        revoked_at: { $ref: "#/components/schemas/Timestamp" }
        last_accessed_at: { $ref: "#/components/schemas/Timestamp" }
        state:
          type: "string"
          enum: ["active", "expired", "revoked"]
    TokenResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/TokenMetadata" }
    TokenListResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data", "page"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data:
          type: "array"
          minItems: 0
          maxItems: 200
          items: { $ref: "#/components/schemas/TokenMetadata" }
        page: { $ref: "#/components/schemas/PageInfo" }
    TokenIssueData:
      type: "object"
      additionalProperties: false
      required: ["metadata", "replayed"]
      properties:
        metadata: { $ref: "#/components/schemas/TokenMetadata" }
        replayed:
          type: "boolean"
        token: { $ref: "#/components/schemas/SubscriptionToken" }
      allOf:
        -
          if:
            properties:
              replayed:
                const: true
          then:
            not:
              required: ["token"]
          else:
            required: ["token"]
    TokenIssueResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/TokenIssueData" }
    ExportResourceRef:
      type: "object"
      additionalProperties: false
      required: ["resource_id", "kind", "revision"]
      properties:
        resource_id: { $ref: "#/components/schemas/UUID" }
        kind:
          type: "string"
          enum: ["node", "chain", "policy_group", "routing_profile", "dns_profile", "rule_set", "subscription_profile"]
        revision: { $ref: "#/components/schemas/Revision" }
    ResourceExportRequest:
      type: "object"
      additionalProperties: false
      required: ["type", "resources", "format", "include_secrets"]
      properties:
        type:
          type: "string"
          const: "resources"
        resources:
          type: "array"
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/ExportResourceRef" }
          uniqueItems: true
        format:
          type: "string"
          enum: ["proxyloom_json", "uri_list", "base64_uri_list"]
        include_secrets:
          type: "boolean"
    PublicationExportRequest:
      type: "object"
      additionalProperties: false
      required: ["type", "publication_id", "target_keys", "format", "include_secrets"]
      properties:
        type:
          type: "string"
          const: "publication"
        publication_id: { $ref: "#/components/schemas/UUID" }
        target_keys:
          type: "array"
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/TargetKey" }
          uniqueItems: true
        format:
          type: "string"
          enum: ["xray_json", "singbox_json", "mihomo_yaml"]
        include_secrets:
          type: "boolean"
    ExportRequest:
      oneOf:
        - { $ref: "#/components/schemas/ResourceExportRequest" }
        - { $ref: "#/components/schemas/PublicationExportRequest" }
    ExportedArtifact:
      type: "object"
      additionalProperties: false
      required: ["filename", "media_type", "content", "contains_secrets"]
      properties:
        filename:
          type: "string"
          pattern: "^[A-Za-z0-9_-]{1,100}\\.(?:json|yaml|txt)$"
          description: "Server-selected attachment label, never a client-controlled path."
        media_type:
          type: "string"
          enum: ["application/json", "application/yaml", "text/plain"]
        content:
          type: "string"
          maxLength: 10485760
          x-sensitive: true
          description: "Explicit export bytes serialized as UTF-8 text. Secret exports require recent authentication; redacted exports cannot be republished as working configurations."
        contains_secrets:
          type: "boolean"
    ExportData:
      type: "object"
      additionalProperties: false
      required: ["artifacts", "created_at"]
      properties:
        artifacts:
          type: "array"
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/ExportedArtifact" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    ExportResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/ExportData" }
    TestLimits:
      type: "object"
      additionalProperties: false
      required: ["duration_ms", "max_bytes"]
      properties:
        duration_ms:
          type: "integer"
          minimum: 1
          maximum: 300000
        max_bytes:
          type: "integer"
          minimum: 0
          maximum: 1073741824
      description: "Requested or server-adopted upper bounds. Server clamps to configured system/target quotas and atomically reserves the attempt budget. Byte counts are application bytes. Integers remain within JavaScript safe range."
    HTTPExpectation:
      type: "object"
      additionalProperties: false
      required: ["status_codes", "max_response_bytes", "egress_ip_response"]
      properties:
        status_codes:
          type: "array"
          minItems: 1
          maxItems: 10
          items:
            type: "integer"
            minimum: 100
            maximum: 599
          uniqueItems: true
        body_sha256: { $ref: "#/components/schemas/SHA256" }
        max_response_bytes:
          type: "integer"
          minimum: 1
          maximum: 1073741824
        egress_ip_response:
          type: "boolean"
      description: "No arbitrary script, expression or response template. Optional SHA-256 checks an exact controlled response; egress IP parsing uses a fixed built-in format."
    TestTargetConfig:
      type: "object"
      additionalProperties: false
      required: ["url", "allowed_types", "expected_response", "limits", "permission_basis", "redirect_policy", "verify_certificate", "compression"]
      properties:
        url: { $ref: "#/components/schemas/HTTPSURL" }
        allowed_types:
          type: "array"
          minItems: 1
          maxItems: 2
          items:
            type: "string"
            enum: ["connectivity", "download_throughput"]
          uniqueItems: true
        expected_response: { $ref: "#/components/schemas/HTTPExpectation" }
        limits: { $ref: "#/components/schemas/TestLimits" }
        permission_basis:
          type: "string"
          enum: ["self_owned", "explicitly_authorized"]
        redirect_policy:
          type: "string"
          const: "deny"
        verify_certificate:
          type: "boolean"
          const: true
        compression:
          type: "string"
          const: "disabled"
    TestTargetCreateRequest:
      type: "object"
      additionalProperties: false
      required: ["name", "target"]
      properties:
        name: { $ref: "#/components/schemas/Name" }
        enabled:
          type: "boolean"
        target: { $ref: "#/components/schemas/TestTargetConfig" }
    TestTargetPatch:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        url: { $ref: "#/components/schemas/HTTPSURL" }
        allowed_types:
          type: "array"
          minItems: 1
          maxItems: 2
          items:
            type: "string"
            enum: ["connectivity", "download_throughput"]
          uniqueItems: true
        expected_response: { $ref: "#/components/schemas/HTTPExpectation" }
        limits: { $ref: "#/components/schemas/TestLimits" }
        permission_basis:
          type: "string"
          enum: ["self_owned", "explicitly_authorized"]
        redirect_policy:
          type: "string"
          const: "deny"
        verify_certificate:
          type: "boolean"
          const: true
        compression:
          type: "string"
          const: "disabled"
      minProperties: 1
    TestTargetPatchRequest:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        name: { $ref: "#/components/schemas/Name" }
        enabled:
          type: "boolean"
        target: { $ref: "#/components/schemas/TestTargetPatch" }
      minProperties: 1
    TestTarget:
      type: "object"
      additionalProperties: false
      required: ["test_target_id", "revision", "name", "enabled", "target", "safety_state", "diagnostics", "created_at"]
      properties:
        test_target_id: { $ref: "#/components/schemas/UUID" }
        revision: { $ref: "#/components/schemas/Revision" }
        name: { $ref: "#/components/schemas/Name" }
        enabled:
          type: "boolean"
        target: { $ref: "#/components/schemas/TestTargetConfig" }
        safety_state:
          type: "string"
          enum: ["pending", "approved", "rejected"]
        safety_checked_at: { $ref: "#/components/schemas/Timestamp" }
        diagnostics: { $ref: "#/components/schemas/Diagnostics" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    TestTargetResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/TestTarget" }
    TestTargetListResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data", "page"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data:
          type: "array"
          minItems: 0
          maxItems: 200
          items: { $ref: "#/components/schemas/TestTarget" }
        page: { $ref: "#/components/schemas/PageInfo" }
    RunnerJobType:
      type: "string"
      enum: ["config_validate", "connectivity", "download_throughput"]
    APIWorkerJobType:
      type: "string"
      enum: ["source_refresh", "import_parse", "compile"]
    JobType:
      type: "string"
      enum: ["source_refresh", "import_parse", "compile", "config_validate", "connectivity", "download_throughput"]
    JobState:
      type: "string"
      enum: ["queued", "leased", "running", "succeeded", "failed", "canceled", "timed_out"]
    TerminalJobState:
      type: "string"
      enum: ["succeeded", "failed", "canceled", "timed_out"]
    Verdict:
      type: "string"
      enum: ["pass", "fail", "inconclusive"]
    TestSubject:
      type: "object"
      additionalProperties: false
      required: ["kind", "id"]
      properties:
        kind:
          type: "string"
          enum: ["node", "chain"]
        id: { $ref: "#/components/schemas/UUID" }
    FrozenTestSubject:
      type: "object"
      additionalProperties: false
      required: ["kind", "id", "revision", "security_epoch"]
      properties:
        kind:
          type: "string"
          enum: ["node", "chain"]
        id: { $ref: "#/components/schemas/UUID" }
        revision: { $ref: "#/components/schemas/Revision" }
        security_epoch: { $ref: "#/components/schemas/Revision" }
    TestCreateRequest:
      type: "object"
      additionalProperties: false
      required: ["subjects", "core_build_id", "type", "limits"]
      properties:
        subjects:
          type: "array"
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/TestSubject" }
          uniqueItems: true
        core_build_id: { $ref: "#/components/schemas/UUID" }
        type: { $ref: "#/components/schemas/RunnerJobType" }
        test_target_id: { $ref: "#/components/schemas/UUID" }
        limits: { $ref: "#/components/schemas/TestLimits" }
      allOf:
        -
          if:
            properties:
              type:
                enum: ["connectivity", "download_throughput"]
          then:
            required: ["test_target_id"]
            properties:
              limits:
                properties:
                  max_bytes:
                    minimum: 1
      description: "Only enabled registered target IDs are accepted for network tests; no arbitrary URL, native config, executable, shell or filesystem path. The service freezes current subject revisions, epochs, approved target revision and exact build."
    Job:
      type: "object"
      additionalProperties: false
      required: ["job_id", "revision", "executor", "type", "state", "attempt", "lease_seq", "cancel_requested", "created_at"]
      properties:
        job_id: { $ref: "#/components/schemas/UUID" }
        revision: { $ref: "#/components/schemas/Revision" }
        executor:
          type: "string"
          enum: ["api_worker", "runner"]
        type: { $ref: "#/components/schemas/JobType" }
        state: { $ref: "#/components/schemas/JobState" }
        attempt:
          type: "integer"
          minimum: 0
          maximum: 100
        lease_seq: { $ref: "#/components/schemas/Counter" }
        cancel_requested:
          type: "boolean"
        created_at: { $ref: "#/components/schemas/Timestamp" }
        batch_id: { $ref: "#/components/schemas/UUID" }
        subject: { $ref: "#/components/schemas/FrozenTestSubject" }
        core_build_id: { $ref: "#/components/schemas/UUID" }
        test_target_id: { $ref: "#/components/schemas/UUID" }
        verdict: { $ref: "#/components/schemas/Verdict" }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { $ref: "#/components/schemas/Timestamp" }
        error: { $ref: "#/components/schemas/SafeError" }
      allOf:
        -
          if:
            properties:
              executor:
                const: "api_worker"
          then:
            properties:
              type: { $ref: "#/components/schemas/APIWorkerJobType" }
        -
          if:
            properties:
              executor:
                const: "runner"
          then:
            properties:
              type: { $ref: "#/components/schemas/RunnerJobType" }
      description: "Persistent execution state is independent of verdict. A complete negative network probe is succeeded+fail; infrastructure failure is failed. Missing verdict means no conclusion yet. No raw input or output payload is a job field."
    JobResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/Job" }
    JobListResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data", "page"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data:
          type: "array"
          minItems: 0
          maxItems: 200
          items: { $ref: "#/components/schemas/Job" }
        page: { $ref: "#/components/schemas/PageInfo" }
    TestBatch:
      type: "object"
      additionalProperties: false
      required: ["batch_id", "revision", "state", "job_ids", "children", "completed", "total", "cancel_requested", "effective_limits", "created_at"]
      properties:
        batch_id: { $ref: "#/components/schemas/UUID" }
        revision: { $ref: "#/components/schemas/Revision" }
        state:
          type: "string"
          enum: ["queued", "running", "succeeded", "failed", "canceled", "timed_out"]
        verdict: { $ref: "#/components/schemas/Verdict" }
        job_ids:
          type: "array"
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/UUID" }
          uniqueItems: true
        children:
          type: "array"
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/Job" }
        completed:
          type: "integer"
          minimum: 0
          maximum: 200
        total:
          type: "integer"
          minimum: 1
          maximum: 200
        cancel_requested:
          type: "boolean"
        effective_limits: { $ref: "#/components/schemas/TestLimits" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
      description: "Parent snapshot. job_ids exactly match children; total equals child count and completed counts terminal children. All completed normally => succeeded, even if verdict=fail. Once children settle, infrastructure failure => failed; otherwise timeout => timed_out; otherwise cancellation => canceled. Aggregate verdict is fail if any conclusive child fails, pass if all pass, otherwise inconclusive. Unfinished batches omit aggregate verdict. Cancellation persists on every unfinished child and does not rewrite terminal results; completed may never exceed total."
    TestBatchResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/TestBatch" }
    TestMetrics:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        config_check_ms:
          type: "number"
          minimum: 0
          maximum: 300000
        core_start_ms:
          type: "number"
          minimum: 0
          maximum: 300000
        proxy_dial_ms:
          type: "number"
          minimum: 0
          maximum: 300000
        target_tls_ms:
          type: "number"
          minimum: 0
          maximum: 300000
        http_ttfb_ms:
          type: "number"
          minimum: 0
          maximum: 300000
        http_total_ms:
          type: "number"
          minimum: 0
          maximum: 300000
        body_bytes:
          type: "integer"
          minimum: 0
          maximum: 1073741824
        body_duration_ms:
          type: "number"
          minimum: 0
          maximum: 300000
        throughput_mbps:
          type: "number"
          minimum: 0
          maximum: 1000000
        egress_ip: { $ref: "#/components/schemas/IPAddress" }
        sample_count:
          type: "integer"
          minimum: 0
          maximum: 1000
        failure_count:
          type: "integer"
          minimum: 0
          maximum: 1000
      description: "Only measured fields are present. Throughput=body_bytes*8/body_duration_seconds/1,000,000; omit when duration<1 second or bytes below the configured threshold and report inconclusive/INSUFFICIENT_SAMPLE. Timing is monotonic and explicitly scoped; HTTP timings are not ICMP Ping. Three small independent samples use a median, never a synthetic P95."
    JobPhase:
      type: "string"
      enum: ["queued", "leased", "fetching", "parsing", "compiling", "preparing", "validating", "starting", "running", "probing", "downloading", "collecting", "settling", "canceling", "completed"]
    RunnerPhase:
      type: "string"
      enum: ["leased", "preparing", "validating", "starting", "running", "probing", "downloading", "collecting", "settling", "canceling", "completed"]
    RunnerJobHeartbeatRequest:
      type: "object"
      additionalProperties: false
      required: ["job_id", "attempt", "lease_seq"]
      properties:
        job_id: { $ref: "#/components/schemas/UUID" }
        attempt:
          type: "integer"
          minimum: 1
          maximum: 100
        lease_seq: { $ref: "#/components/schemas/Revision" }
    RunnerJobEventRequest:
      type: "object"
      additionalProperties: false
      required: ["job_id", "attempt", "lease_seq", "event_id", "phase", "completed", "total"]
      properties:
        job_id: { $ref: "#/components/schemas/UUID" }
        attempt:
          type: "integer"
          minimum: 1
          maximum: 100
        lease_seq: { $ref: "#/components/schemas/Revision" }
        event_id: { $ref: "#/components/schemas/UUID" }
        phase: { $ref: "#/components/schemas/RunnerPhase" }
        completed:
          type: "integer"
          minimum: 0
          maximum: 2147483647
        total:
          type: "integer"
          minimum: 0
          maximum: 2147483647
        verdict: { $ref: "#/components/schemas/Verdict" }
        error: { $ref: "#/components/schemas/SafeError" }
      description: "completed<=total is also checked by the service. Error summaries are fixed safe messages, not arbitrary Runner output. event_id deduplicates delivery inside the valid attempt."
    RunnerJobResultRequest:
      type: "object"
      additionalProperties: false
      required: ["job_id", "attempt", "lease_seq", "result_hash", "state", "metrics"]
      properties:
        job_id: { $ref: "#/components/schemas/UUID" }
        attempt:
          type: "integer"
          minimum: 1
          maximum: 100
        lease_seq: { $ref: "#/components/schemas/Revision" }
        result_hash: { $ref: "#/components/schemas/SHA256" }
        state: { $ref: "#/components/schemas/TerminalJobState" }
        verdict: { $ref: "#/components/schemas/Verdict" }
        metrics: { $ref: "#/components/schemas/TestMetrics" }
        error: { $ref: "#/components/schemas/SafeError" }
      allOf:
        -
          if:
            properties:
              state:
                const: "succeeded"
          then:
            required: ["verdict"]
      description: "Only fenced current-attempt results are accepted; server verifies canonical result_hash and settles the reservation once. Same accepted identity/hash replays metadata, different hash conflicts. A completed failing probe uses succeeded+fail."
    JobEvent:
      type: "object"
      additionalProperties: false
      required: ["job_id", "seq", "phase", "completed", "total"]
      properties:
        job_id: { $ref: "#/components/schemas/UUID" }
        seq: { $ref: "#/components/schemas/Revision" }
        phase: { $ref: "#/components/schemas/JobPhase" }
        completed:
          type: "integer"
          minimum: 0
          maximum: 2147483647
        total:
          type: "integer"
          minimum: 0
          maximum: 2147483647
        verdict: { $ref: "#/components/schemas/Verdict" }
        error: { $ref: "#/components/schemas/SafeError" }
      description: "SSE event=job_event; SSE id is decimal seq. Sequence is server-assigned, persisted and monotonically increasing across attempts. completed<=total. No raw stdout/stderr, arbitrary JSON data or unbounded log text."
    SnapshotResetEvent:
      type: "object"
      additionalProperties: false
      required: ["job_id", "latest_seq", "snapshot_url"]
      properties:
        job_id: { $ref: "#/components/schemas/UUID" }
        latest_seq: { $ref: "#/components/schemas/Counter" }
        snapshot_url:
          type: "string"
          pattern: "^/api/v1/jobs/[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: "SSE event=snapshot_reset. Requested history is outside the retained window; close the stream and reread this same job's authorized snapshot. snapshot_url UUID must equal job_id."
    RunnerBuildReport:
      type: "object"
      additionalProperties: false
      required: ["core_build_id", "build_sha256"]
      properties:
        core_build_id: { $ref: "#/components/schemas/UUID" }
        build_sha256: { $ref: "#/components/schemas/SHA256" }
    RunnerSlots:
      type: "object"
      additionalProperties: false
      required: ["config_validate", "connectivity", "download_throughput"]
      properties:
        config_validate:
          type: "integer"
          minimum: 0
          maximum: 64
        connectivity:
          type: "integer"
          minimum: 0
          maximum: 64
        download_throughput:
          type: "integer"
          minimum: 0
          maximum: 16
    RunnerHeartbeatRequest:
      type: "object"
      additionalProperties: false
      required: ["runner_id", "platform", "architecture", "builds", "available_slots", "load"]
      properties:
        runner_id: { $ref: "#/components/schemas/UUID" }
        platform: { $ref: "#/components/schemas/Platform" }
        architecture: { $ref: "#/components/schemas/Architecture" }
        builds:
          type: "array"
          minItems: 0
          maxItems: 100
          items: { $ref: "#/components/schemas/RunnerBuildReport" }
        available_slots: { $ref: "#/components/schemas/RunnerSlots" }
        load:
          type: "object"
          additionalProperties: false
          required: ["active_jobs", "cpu_throttled", "memory_available_bytes"]
          properties:
            active_jobs:
              type: "integer"
              minimum: 0
              maximum: 144
            cpu_throttled:
              type: "boolean"
            memory_available_bytes:
              type: "integer"
              minimum: 0
              maximum: 9007199254740991
      description: "Certificate-bound identity and server registration are authoritative. No capabilities, location or binaries may be installed merely because this request advertises them."
    RunnerHeartbeatData:
      type: "object"
      additionalProperties: false
      required: ["runner_id", "heartbeat_interval_ms", "lease_duration_ms", "server_time", "accepted_build_ids"]
      properties:
        runner_id: { $ref: "#/components/schemas/UUID" }
        heartbeat_interval_ms:
          type: "integer"
          minimum: 1000
          maximum: 30000
        lease_duration_ms:
          type: "integer"
          minimum: 1000
          maximum: 120000
        server_time: { $ref: "#/components/schemas/Timestamp" }
        accepted_build_ids:
          type: "array"
          minItems: 0
          maxItems: 100
          items: { $ref: "#/components/schemas/UUID" }
          uniqueItems: true
    RunnerHeartbeatResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/RunnerHeartbeatData" }
    RunnerLeaseRequest:
      type: "object"
      additionalProperties: false
      required: ["runner_id", "available_slots"]
      properties:
        runner_id: { $ref: "#/components/schemas/UUID" }
        available_slots: { $ref: "#/components/schemas/RunnerSlots" }
      description: "Only capacity is requested. The server matches its registered certificate capabilities to queue types and exact builds. A client cannot nominate a job, URL, command, path or user configuration."
    RunnerArtifact:
      type: "object"
      additionalProperties: false
      required: ["artifact_id", "format", "sha256", "byte_length", "content_base64"]
      properties:
        artifact_id: { $ref: "#/components/schemas/UUID" }
        format: { $ref: "#/components/schemas/OutputFormat" }
        sha256: { $ref: "#/components/schemas/SHA256" }
        byte_length:
          type: "integer"
          minimum: 1
          maximum: 10485760
        content_base64:
          type: "string"
          maxLength: 13981016
          contentEncoding: "base64"
          pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
          x-sensitive: true
      description: "Server-generated frozen compiled bytes supplied only on the internal mTLS response. Runner verifies decoded length, digest and matching fixed core build before creating its own 0700 directory/0600 file. Never accepted as a caller-supplied native config, shell, argv or path; never logged."
    FrozenTestTarget:
      type: "object"
      additionalProperties: false
      required: ["test_target_id", "revision", "url", "validated_ips", "expected_response", "redirect_policy", "verify_certificate", "compression"]
      properties:
        test_target_id: { $ref: "#/components/schemas/UUID" }
        revision: { $ref: "#/components/schemas/Revision" }
        url: { $ref: "#/components/schemas/HTTPSURL" }
        validated_ips:
          type: "array"
          minItems: 1
          maxItems: 16
          items: { $ref: "#/components/schemas/IPAddress" }
          uniqueItems: true
        expected_response: { $ref: "#/components/schemas/HTTPExpectation" }
        redirect_policy:
          type: "string"
          const: "deny"
        verify_certificate:
          type: "boolean"
          const: true
        compression:
          type: "string"
          const: "disabled"
      description: "Immutable approved registry target for this attempt. Enforce pinned validated addresses while retaining Host/SNI and certificate verification. Revalidate safety at execution; never accept replacement URLs from a probe caller."
    RunnerExecutionPolicy:
      type: "object"
      additionalProperties: false
      required: ["network", "allow_environment_proxy", "allow_core_downloads", "allow_shell", "termination_grace_ms", "memory_limit_bytes", "process_limit"]
      properties:
        network:
          type: "string"
          enum: ["none", "controlled_target_only"]
        allow_environment_proxy:
          type: "boolean"
          const: false
        allow_core_downloads:
          type: "boolean"
          const: false
        allow_shell:
          type: "boolean"
          const: false
        termination_grace_ms:
          type: "integer"
          minimum: 100
          maximum: 10000
        memory_limit_bytes:
          type: "integer"
          minimum: 1048576
          maximum: 2147483647
        process_limit:
          type: "integer"
          minimum: 1
          maximum: 32
    RunnerLease:
      type: "object"
      additionalProperties: false
      required: ["job_id", "attempt", "lease_seq", "lease_expires_at", "schema_version", "type", "core", "artifact", "limits", "execution_policy", "payload_sha256"]
      properties:
        job_id: { $ref: "#/components/schemas/UUID" }
        attempt:
          type: "integer"
          minimum: 1
          maximum: 100
        lease_seq: { $ref: "#/components/schemas/Revision" }
        lease_expires_at: { $ref: "#/components/schemas/Timestamp" }
        schema_version: { $ref: "#/components/schemas/SchemaVersion" }
        type: { $ref: "#/components/schemas/RunnerJobType" }
        core: { $ref: "#/components/schemas/CoreIdentity" }
        artifact: { $ref: "#/components/schemas/RunnerArtifact" }
        subject: { $ref: "#/components/schemas/FrozenTestSubject" }
        test_target: { $ref: "#/components/schemas/FrozenTestTarget" }
        limits: { $ref: "#/components/schemas/TestLimits" }
        execution_policy: { $ref: "#/components/schemas/RunnerExecutionPolicy" }
        payload_sha256: { $ref: "#/components/schemas/SHA256" }
        quota_reservation_id: { $ref: "#/components/schemas/UUID" }
      allOf:
        -
          if:
            properties:
              type:
                enum: ["connectivity", "download_throughput"]
          then:
            required: ["subject", "test_target", "quota_reservation_id"]
            properties:
              execution_policy:
                properties:
                  network:
                    const: "controlled_target_only"
        -
          if:
            properties:
              type:
                const: "config_validate"
          then:
            not:
              required: ["test_target"]
            properties:
              execution_policy:
                properties:
                  network:
                    const: "none"
      description: "Server-assigned bounded lease. payload_sha256 binds the canonical frozen payload. Paths, argv and controlled local listener ports are allocated by the registered Runner adapter, never supplied by users. Expired renewal requires local stop before expiry."
    RunnerLeaseData:
      type: "object"
      additionalProperties: false
      required: ["lease"]
      properties:
        lease:
          anyOf:
            - { $ref: "#/components/schemas/RunnerLease" }
            -
              type: "null"
    RunnerLeaseResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/RunnerLeaseData" }
    RunnerJobHeartbeatData:
      type: "object"
      additionalProperties: false
      required: ["job_id", "attempt", "lease_seq", "lease_expires_at", "cancel_requested"]
      properties:
        job_id: { $ref: "#/components/schemas/UUID" }
        attempt:
          type: "integer"
          minimum: 1
          maximum: 100
        lease_seq: { $ref: "#/components/schemas/Revision" }
        lease_expires_at: { $ref: "#/components/schemas/Timestamp" }
        cancel_requested:
          type: "boolean"
    RunnerJobHeartbeatResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/RunnerJobHeartbeatData" }
    RunnerJobEventReceipt:
      type: "object"
      additionalProperties: false
      required: ["job_id", "attempt", "lease_seq", "event_id", "seq", "replayed"]
      properties:
        job_id: { $ref: "#/components/schemas/UUID" }
        attempt:
          type: "integer"
          minimum: 1
          maximum: 100
        lease_seq: { $ref: "#/components/schemas/Revision" }
        event_id: { $ref: "#/components/schemas/UUID" }
        seq: { $ref: "#/components/schemas/Revision" }
        replayed:
          type: "boolean"
    RunnerJobEventResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/RunnerJobEventReceipt" }
    RunnerJobResultReceipt:
      type: "object"
      additionalProperties: false
      required: ["job_id", "attempt", "lease_seq", "result_id", "result_hash", "replayed", "settled_bytes"]
      properties:
        job_id: { $ref: "#/components/schemas/UUID" }
        attempt:
          type: "integer"
          minimum: 1
          maximum: 100
        lease_seq: { $ref: "#/components/schemas/Revision" }
        result_id: { $ref: "#/components/schemas/UUID" }
        result_hash: { $ref: "#/components/schemas/SHA256" }
        replayed:
          type: "boolean"
        settled_bytes:
          type: "integer"
          minimum: 0
          maximum: 1073741824
    RunnerJobResultResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/RunnerJobResultReceipt" }
    TestResult:
      type: "object"
      additionalProperties: false
      required: ["result_id", "job_id", "batch_id", "subject", "core_build_id", "core_build_sha256", "runner_id", "location", "attempt", "type", "state", "metrics", "effective_limits", "truncated_by", "cpu_throttled", "stale", "completed_at"]
      properties:
        result_id: { $ref: "#/components/schemas/UUID" }
        job_id: { $ref: "#/components/schemas/UUID" }
        batch_id: { $ref: "#/components/schemas/UUID" }
        subject: { $ref: "#/components/schemas/FrozenTestSubject" }
        core_build_id: { $ref: "#/components/schemas/UUID" }
        core_build_sha256: { $ref: "#/components/schemas/SHA256" }
        runner_id: { $ref: "#/components/schemas/UUID" }
        location: { $ref: "#/components/schemas/ShortText" }
        attempt:
          type: "integer"
          minimum: 1
          maximum: 100
        type: { $ref: "#/components/schemas/RunnerJobType" }
        test_target_id: { $ref: "#/components/schemas/UUID" }
        test_target_revision: { $ref: "#/components/schemas/Revision" }
        state: { $ref: "#/components/schemas/TerminalJobState" }
        verdict: { $ref: "#/components/schemas/Verdict" }
        metrics: { $ref: "#/components/schemas/TestMetrics" }
        effective_limits: { $ref: "#/components/schemas/TestLimits" }
        truncated_by:
          type: "string"
          enum: ["none", "duration", "bytes"]
        cpu_throttled:
          type: "boolean"
        current_subject_revision: { $ref: "#/components/schemas/Revision" }
        stale:
          type: "boolean"
        completed_at: { $ref: "#/components/schemas/Timestamp" }
        error: { $ref: "#/components/schemas/SafeError" }
      description: "Frozen evidence uses the tested subject revision; stale is a live comparison with the current subject. Missing/expired network samples never become publication gates automatically."
    TestResultListResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data", "page"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data:
          type: "array"
          minItems: 0
          maxItems: 200
          items: { $ref: "#/components/schemas/TestResult" }
        page: { $ref: "#/components/schemas/PageInfo" }
    QuotaSettings:
      type: "object"
      additionalProperties: false
      required: ["daily_download_bytes", "connectivity_concurrency", "throughput_concurrency", "max_test_duration_ms", "max_test_bytes", "minimum_throughput_sample_bytes"]
      properties:
        daily_download_bytes:
          type: "integer"
          minimum: 1
          maximum: 9007199254740991
        connectivity_concurrency:
          type: "integer"
          minimum: 1
          maximum: 64
        throughput_concurrency:
          type: "integer"
          minimum: 1
          maximum: 16
        max_test_duration_ms:
          type: "integer"
          minimum: 1000
          maximum: 300000
        max_test_bytes:
          type: "integer"
          minimum: 1
          maximum: 1073741824
        minimum_throughput_sample_bytes:
          type: "integer"
          minimum: 1
          maximum: 1073741824
      description: "UTC daily bucket; reservations lock before scheduling. Requested values cannot raise immutable host-level resource isolation limits. Retry attempts reserve independently; unknown throughput usage is conservatively settled at its reserved upper bound."
    RetentionSettings:
      type: "object"
      additionalProperties: false
      required: ["job_event_days", "test_result_days", "audit_days", "idempotency_hours"]
      properties:
        job_event_days:
          type: "integer"
          minimum: 1
          maximum: 365
        test_result_days:
          type: "integer"
          minimum: 1
          maximum: 3650
        audit_days:
          type: "integer"
          minimum: 1
          maximum: 3650
        idempotency_hours:
          type: "integer"
          minimum: 1
          maximum: 168
    CatalogLimits:
      type: "object"
      additionalProperties: false
      required: ["max_import_bytes", "max_import_items", "max_dependency_resources", "max_targets_per_subscription"]
      properties:
        max_import_bytes:
          type: "integer"
          minimum: 1
          maximum: 10485760
        max_import_items:
          type: "integer"
          minimum: 1
          maximum: 100000
        max_dependency_resources:
          type: "integer"
          minimum: 1
          maximum: 10000
        max_targets_per_subscription:
          type: "integer"
          minimum: 1
          maximum: 32
    SystemSettings:
      type: "object"
      additionalProperties: false
      required: ["revision", "quota", "retention", "catalog_limits"]
      properties:
        revision: { $ref: "#/components/schemas/Revision" }
        quota: { $ref: "#/components/schemas/QuotaSettings" }
        retention: { $ref: "#/components/schemas/RetentionSettings" }
        catalog_limits: { $ref: "#/components/schemas/CatalogLimits" }
    SettingsResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data: { $ref: "#/components/schemas/SystemSettings" }
    QuotaSettingsPatch:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        daily_download_bytes:
          type: "integer"
          minimum: 1
          maximum: 9007199254740991
        connectivity_concurrency:
          type: "integer"
          minimum: 1
          maximum: 64
        throughput_concurrency:
          type: "integer"
          minimum: 1
          maximum: 16
        max_test_duration_ms:
          type: "integer"
          minimum: 1000
          maximum: 300000
        max_test_bytes:
          type: "integer"
          minimum: 1
          maximum: 1073741824
        minimum_throughput_sample_bytes:
          type: "integer"
          minimum: 1
          maximum: 1073741824
      minProperties: 1
    RetentionSettingsPatch:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        job_event_days:
          type: "integer"
          minimum: 1
          maximum: 365
        test_result_days:
          type: "integer"
          minimum: 1
          maximum: 3650
        audit_days:
          type: "integer"
          minimum: 1
          maximum: 3650
        idempotency_hours:
          type: "integer"
          minimum: 1
          maximum: 168
      minProperties: 1
    CatalogLimitsPatch:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        max_import_bytes:
          type: "integer"
          minimum: 1
          maximum: 10485760
        max_import_items:
          type: "integer"
          minimum: 1
          maximum: 100000
        max_dependency_resources:
          type: "integer"
          minimum: 1
          maximum: 10000
        max_targets_per_subscription:
          type: "integer"
          minimum: 1
          maximum: 32
      minProperties: 1
    SettingsPatchRequest:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        quota: { $ref: "#/components/schemas/QuotaSettingsPatch" }
        retention: { $ref: "#/components/schemas/RetentionSettingsPatch" }
        catalog_limits: { $ref: "#/components/schemas/CatalogLimitsPatch" }
      minProperties: 1
    AuditAction:
      type: "string"
      enum: ["setup", "login", "logout", "reauth", "create", "update", "delete", "reveal", "source_refresh", "import_commit", "compile", "publish", "rollback", "token_issue", "token_revoke", "test_create", "job_cancel", "core_disable", "settings_update", "secret_rewrap", "export"]
    AuditEvent:
      type: "object"
      additionalProperties: false
      required: ["event_id", "created_at", "request_id", "actor_type", "action", "outcome", "changed_fields"]
      properties:
        event_id: { $ref: "#/components/schemas/UUID" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        request_id: { $ref: "#/components/schemas/RequestID" }
        actor_type:
          type: "string"
          enum: ["administrator", "runner", "system"]
        actor_id: { $ref: "#/components/schemas/UUID" }
        action: { $ref: "#/components/schemas/AuditAction" }
        resource_id: { $ref: "#/components/schemas/UUID" }
        resource_kind: { $ref: "#/components/schemas/ResourceKind" }
        revision: { $ref: "#/components/schemas/Revision" }
        operation_id: { $ref: "#/components/schemas/UUID" }
        outcome:
          type: "string"
          enum: ["success", "failure"]
        changed_fields:
          type: "array"
          minItems: 0
          maxItems: 100
          items: { $ref: "#/components/schemas/SafeFieldPath" }
        error_code: { $ref: "#/components/schemas/ErrorCode" }
      description: "Allowlisted metadata only. Never includes original request/response, credential values, token HMACs, ciphertext, native configuration, arbitrary JSON metadata or raw logs."
    AuditEventListResponse:
      type: "object"
      additionalProperties: false
      required: ["request_id", "data", "page"]
      properties:
        request_id: { $ref: "#/components/schemas/RequestID" }
        data:
          type: "array"
          minItems: 0
          maxItems: 200
          items: { $ref: "#/components/schemas/AuditEvent" }
        page: { $ref: "#/components/schemas/PageInfo" }
    Tag:
      type: "string"
      minLength: 1
      maxLength: 64
      pattern: "^[^\\x00-\\x1f\\x7f]+$"
paths:
  /api/v1/setup:
    post:
      operationId: setup
      x-implementation-status: implemented
      security: []
      summary: Initialize the administrator once while the system is empty
      description: Requires the configured one-time setup credential, exact Origin and JSON. Never accepts a scope or resource revision. Disabled after the first successful initialization.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetupRequest'}
      responses:
        '413': {$ref: '#/components/responses/TooLarge'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '201': {$ref: '#/components/responses/SessionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/login:
    post:
      operationId: login
      x-implementation-status: implemented
      security: []
      summary: Authenticate and rotate the management session
      description: Requires exact Origin and application/json; no existing session or CSRF token required. Login does not establish a recent reauthentication marker.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '200': {$ref: '#/components/responses/SessionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      x-implementation-status: implemented
      summary: Revoke the current management session
      description: Requires exact Origin, application/json and X-CSRF-Token. Authentication operations have no resource If-Match precondition.
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LogoutRequest'}
      responses:
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '200': {$ref: '#/components/responses/Acknowledgement'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      x-implementation-status: implemented
      summary: Read the authenticated administrator and recent authentication status
      responses:
        '200': {$ref: '#/components/responses/SessionResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/reauth:
    post:
      operationId: reauthenticate
      x-implementation-status: implemented
      summary: Establish a recent authentication marker on the current session
      description: Requires exact Origin, application/json and X-CSRF-Token. The marker expires after five minutes.
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReauthenticationRequest'}
      responses:
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '200': {$ref: '#/components/responses/SessionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/imports:
    post:
      operationId: createImport
      x-implementation-status: implemented
      summary: Create a bounded import preview job on the API Worker
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportCreateRequest'}
          multipart/form-data:
            schema: {$ref: '#/components/schemas/ImportFileRequest'}
      responses:
        '202': {$ref: '#/components/responses/ImportAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/imports/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getImport
      x-implementation-status: implemented
      summary: Read redacted import candidates and per-entry diagnostics
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {$ref: '#/components/responses/ImportResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/imports/{id}/commit:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: commitImport
      x-implementation-status: implemented
      summary: Commit selected candidates transactionally against the preview revision
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportCommitRequest'}
      responses:
        '200': {$ref: '#/components/responses/ImportCommitResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/sources:
    get:
      operationId: listSources
      x-implementation-status: implemented
      summary: List source metadata without fetch credentials or secret URLs
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Enabled'}, {$ref: '#/components/parameters/Tag'}]
      responses:
        '200': {$ref: '#/components/responses/SourceListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createSource
      x-implementation-status: implemented
      summary: Create a remote source with a constrained fetch policy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/SourceResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/sources/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getSource
      x-implementation-status: implemented
      summary: Read redacted source configuration and latest refresh status
      responses:
        '200': {$ref: '#/components/responses/SourceResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    patch:
      operationId: updateSource
      x-implementation-status: implemented
      summary: Create an immutable source revision with secret-preserving patches
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourcePatchRequest'}
      responses:
        '200': {$ref: '#/components/responses/SourceResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: deleteSource
      x-implementation-status: implemented
      summary: Soft-delete the source and stop new refreshes
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      responses:
        '200': {$ref: '#/components/responses/MutationResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/sources/{id}/refresh:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: refreshSource
      x-implementation-status: implemented
      summary: Enqueue an API Worker refresh with one active lease per source
      description: Captures the matched source revision; final commit also compares source and binding revisions. Never assigned to a Runner.
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/JobResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/nodes:
    get:
      operationId: listNodes
      x-implementation-status: implemented
      summary: List nodes using management-only redacted DTOs
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Enabled'}, {$ref: '#/components/parameters/Tag'}, {$ref: '#/components/parameters/Protocol'}, {$ref: '#/components/parameters/NodeSearch'}]
      responses:
        '200': {$ref: '#/components/responses/NodeListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createNode
      x-implementation-status: implemented
      summary: Create a typed node at revision 1
      description: Generates ID, scope, revision and epoch on the server. No If-Match is required for creation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NodeCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/NodeResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/nodes/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getNode
      x-implementation-status: implemented
      summary: Read a node without returning auth or REALITY secrets
      responses:
        '200': {$ref: '#/components/responses/NodeResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    patch:
      operationId: updateNode
      x-implementation-status: implemented
      summary: Apply a typed node patch and create a new immutable revision
      description: >-
        An absent secret preserves its previous value, null clears it, and a
        string replaces it. The merged node is validated; clearing a required
        password, UUID, username or REALITY field returns 422. Empty or masked
        credentials are invalid. Authentication changes and disabling advance
        the security epoch; a caller cannot label a security change as ordinary.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NodePatchRequest'}
      responses:
        '200': {$ref: '#/components/responses/NodeResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: deleteNode
      x-implementation-status: implemented
      summary: Soft-delete a node and immediately revoke dependent publication access
      description: Preserves immutable history and references; advances revision and security epoch.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      responses:
        '200': {$ref: '#/components/responses/MutationResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/nodes/batch:
    post:
      operationId: updateNodesBatch
      x-implementation-status: implemented
      summary: Apply a bounded metadata operation with individual revision preconditions
      description: Each node has its own precondition and result. A missing item precondition is 428 and a stale one is 412 in that item's result; the batch has no synthetic shared ETag.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NodeBatchRequest'}
      responses:
        '200': {$ref: '#/components/responses/NodeBatchResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/nodes/{id}/revisions:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: listNodeRevisions
      x-implementation-status: implemented
      summary: List immutable redacted revisions with their original metadata
      description: Historical name, tags, enabled and epoch are taken from that revision, never from the current head. History cannot authorize publication of old secrets.
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {$ref: '#/components/responses/NodeListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/nodes/{id}/references:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: listNodeReferences
      x-implementation-status: implemented
      summary: List current active and historical reverse references
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - name: reference_state
          in: query
          schema: {type: string, enum: [active, historical, all], default: active}
      responses:
        '200': {$ref: '#/components/responses/ReferenceListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/chains:
    get:
      operationId: listChains
      x-implementation-status: implemented
      summary: List two-node chain resources
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Enabled'}, {$ref: '#/components/parameters/Tag'}]
      responses:
        '200': {$ref: '#/components/responses/ChainListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createChain
      x-implementation-status: implemented
      summary: Create two distinct concrete node hops with the last hop as exit
      description: References follow node heads in the editing state. Does not modify either node or permit policy-group hops, fixed old revisions, or a direct fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChainCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/ChainResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
