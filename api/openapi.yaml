openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: ProxyLoom P0 API
  version: 1.0.0
  description: >-
    P0 contract for a single configured workspace and trusted administrators.
    Five administrator authentication operations are implemented. Other operations
    remain contract-only; declarations do not assert kernel capability or verification.
    Management uses the session Cookie; internal operations exist exclusively on
    a separate mTLS listener; subscription retrieval uses its mandatory path token
    independently of either credential. Scope and resource IDs are server assigned.
    JSON decoding rejects unknown fields, duplicate keys, trailing documents,
    invalid Unicode, and undocumented nulls. Errors never echo input values.
    All references in this document are local; schema validation must not fetch URLs.
servers:
  - url: /
    description: Management and public subscription listener; internal paths use their own listener.
security:
  - SessionCookie: []
x-implementation-status: contract-only
x-contract-source: docs/project_design_v1.0.md#10-http-api内部接口与错误契约
x-strict-json:
  reject_unknown_fields: true
  reject_duplicate_keys: true
  reject_trailing_documents: true
  reject_invalid_unicode: true
  maximum_body_bytes: 10485760
  maximum_nesting_depth: 128
  maximum_number_bytes: 128
  maximum_number_exponent_magnitude: 308
x-resource-preconditions:
  etag: '"r<N>"'
  missing_status: 428
  malformed_status: 400
  stale_status: 412
  business_or_idempotency_conflict_status: 409
  creation_requires_if_match: false
components:
  securitySchemes:
    SessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "proxyloom_session"
      description: "Opaque server-side administrator session; Secure, HttpOnly, SameSite=Lax. State-changing management operations additionally enforce Origin and X-CSRF-Token. Setup/login require Origin and JSON but no session CSRF token. Secure may be omitted only for explicit development HTTP loopback PUBLIC_URL. Never accepted as subscription or Runner authorization."
    RunnerMTLS:
      type: "mutualTLS"
      description: "Registered client certificate verified only on the dedicated internal listener. Certificate identity and server registration determine eligible builds, task types and slots. No management Cookie or subscription token is accepted."
  headers:
    RequestID:
      description: "Server-generated safe request correlation ID."
      schema: { $ref: "#/components/schemas/RequestID" }
    ETag:
      description: "Strong resource revision tag \"r<N>\". Exactly one tag, no wildcard, weak tag, list, sign, whitespace or leading zero. N fits positive int64."
      schema:
        type: "string"
        pattern: "^\"r(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)\"$"
    NoStore:
      schema:
        type: "string"
        const: "private, no-store"
    RetryAfter:
      description: "Bounded retry delay in seconds."
      schema:
        type: "integer"
        minimum: 1
        maximum: 86400
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF token returned by setup/login/me/reauth. Used together with an exact Origin check.
      schema: {type: string, minLength: 43, maxLength: 43}
    ID:
      name: "id"
      in: "path"
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    IfMatch:
      name: "If-Match"
      in: "header"
      required: true
      description: "Exactly one strong tag \"r<N>\" for the resource being changed. Missing => 428; malformed, weak, wildcard, multi-tag or overflow => 400; valid stale revision => 412. Business/generation/lease/idempotency conflicts => 409. Creates and authentication operations have no resource precondition."
      schema:
        type: "string"
        pattern: "^\"r(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)\"$"
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: false
      description: "Supported on asynchronous creation, publication, token issuance and import commit. One key per authenticated actor + fixed route; request HMAC also binds scope and canonical body. Same key/body waits then replays permitted metadata; changed body is 409. Mutations and idempotency registration commit in the same transaction. No arbitrary response bytes or one-time secrets are replayed."
      schema:
        type: "string"
        pattern: "^[A-Za-z0-9_-]{1,128}$"
    Limit:
      name: "limit"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 200
        default: 50
      description: "Bounded page size. Stable ascending (created_at, id) order unless a collection documents its immutable equivalent."
    Cursor:
      name: "cursor"
      in: "query"
      schema:
        type: "string"
        minLength: 1
        maxLength: 2048
      description: "Opaque authenticated continuation tied to scope, collection, order and normalized filter digest. A changed filter or invalid cursor is 400; authorization is checked separately on every request."
    Enabled:
      name: "enabled"
      in: "query"
      schema:
        type: "boolean"
    Tag:
      name: "tag"
      in: "query"
      schema: { $ref: "#/components/schemas/Tag" }
    Protocol:
      name: "protocol"
      in: "query"
      schema: { $ref: "#/components/schemas/Protocol" }
    NodeSearch:
      name: "q"
      in: "query"
      schema:
        type: "string"
        maxLength: 256
      description: "Case-insensitive node name search; secrets are never searched or echoed."
    CoreFamily:
      name: "core_family"
      in: "query"
      schema: { $ref: "#/components/schemas/CoreFamily" }
    CoreBuildID:
      name: "core_build_id"
      in: "query"
      schema: { $ref: "#/components/schemas/UUID" }
    FromTime:
      name: "from"
      in: "query"
      schema: { $ref: "#/components/schemas/Timestamp" }
      description: "Inclusive UTC time boundary; bound into the cursor filter digest."
    UntilTime:
      name: "until"
      in: "query"
      schema: { $ref: "#/components/schemas/Timestamp" }
      description: "Exclusive UTC time boundary; must follow from when both are supplied."
    LastEventID:
      name: "Last-Event-ID"
      in: "header"
      required: false
      schema: { $ref: "#/components/schemas/Counter" }
      description: "One canonical decimal sequence from the prior SSE id. Zero starts at the beginning. The server replays greater seq values; an expired retention window emits snapshot_reset and requires GET /jobs/{id}."
  responses:
    BadRequest:
      description: "Malformed JSON, duplicate/unknown field, unsafe shape, invalid path/query/header, invalid Unicode or cursor. No submitted key or value is echoed."
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        "application/json":
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: "Required management session or registered internal identity is missing, invalid or expired; surfaces are not interchangeable."
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        "application/json":
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: "Authenticated actor lacks permission, recent authentication, a valid current-actor confirmation or required same-origin protection."
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        "application/json":
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: "Resource does not exist in the authorized scope, or existence must not be disclosed."
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        "application/json":
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: "Business state, generation, idempotency or lease conflict, including COMPILE_OBSOLETE, IDEMPOTENCY_CONFLICT and LEASE_LOST. A stale resource revision is 412 instead."
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        "application/json":
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    PreconditionFailed:
      description: "A syntactically valid If-Match names an outdated resource revision; no mutation was applied."
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        "application/json":
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TooLarge:
      description: "Input, decompressed data, item count or event size exceeds the configured bound."
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        "application/json":
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UnprocessableEntity:
      description: "Shape is understood but merged domain semantics are invalid, including required secret clear, unsupported capability, invalid references, excluded dependencies and DNS cycles."
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        "application/json":
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    PreconditionRequired:
      description: "The versioned resource operation requires If-Match but it was omitted."
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        "application/json":
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: "Rate, slot, concurrent execution or reserved budget limit exceeded."
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        "application/json":
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unavailable:
      description: "Primary database, execution capability or safe publication is unavailable. Fail closed; never serve cached authorization or substitute a direct/empty configuration."
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        "application/json":
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Acknowledgement:
      description: "Typed contract response. This operation is not registered by the foundation contract implementation."
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        "application/json":
          schema: { $ref: "#/components/schemas/AcknowledgementResponse" }
    NodeResponse:
