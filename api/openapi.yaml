        ETag: { $ref: "#/components/headers/ETag" }
      content:
        "application/json":
          schema: { $ref: "#/components/schemas/TestBatchResponse" }
    TestResultListResponse:
      description: "Typed contract response. This operation is not registered by the foundation contract implementation."
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
      content:
        "application/json":
          schema: { $ref: "#/components/schemas/TestResultListResponse" }
    TestTargetListResponse:
      description: "Typed contract response. This operation is not registered by the foundation contract implementation."
      headers:
