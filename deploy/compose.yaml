name: ${PROXYLOOM_PROJECT:-proxyloom}

x-limits: &limits
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  cpus: 1
  mem_limit: 512m
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: '2'}
  stop_grace_period: 15s

x-keys: &keys
  PROXYLOOM_MASTER_KEY_FILE: /run/secrets/master_key
  PROXYLOOM_MASTER_KEY_ID: ${PROXYLOOM_MASTER_KEY_ID:?initialize deployment first}
  PROXYLOOM_OLD_MASTER_KEYS_FILE: /run/secrets/old_master_keys
  PROXYLOOM_TOKEN_PEPPER_FILE: /run/secrets/token_pepper
  PROXYLOOM_CONTENT_HMAC_KEY_FILE: /run/secrets/content_hmac_key

services:
  postgres:
    image: ${PROXYLOOM_POSTGRES_IMAGE:?load release images first}
    environment:
      POSTGRES_DB: proxyloom
      POSTGRES_USER: proxyloom_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/db_bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/proxyloom-data
    secrets: [db_bootstrap_password, db_runtime_password, db_migration_password]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-proxyloom.sh:ro
    networks: [data]
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U proxyloom_bootstrap -d proxyloom']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *limits
    image: ${PROXYLOOM_API_IMAGE:?load release images first}
    command: [migrate, up]
    environment:
      PROXYLOOM_MIGRATION_DSN_FILE: /run/secrets/migration_dsn
    secrets: [migration_dsn]
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'

  api:
    <<: *limits
    cpus: 2
    image: ${PROXYLOOM_API_IMAGE:?load release images first}
    command: [serve]
    environment:
      <<: *keys
      PROXYLOOM_DEV_MODE: ${PROXYLOOM_DEV_MODE:-false}
      PROXYLOOM_HTTP_ADDR: ':8080'
      PROXYLOOM_PUBLIC_URL: ${PROXYLOOM_PUBLIC_URL:?public origin required}
      PROXYLOOM_WEB_DIR: /app/web
      PROXYLOOM_DATABASE_DSN_FILE: /run/secrets/database_dsn
      PROXYLOOM_SETUP_TOKEN_FILE: /run/secrets/setup_token
      PROXYLOOM_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      PROXYLOOM_RUNNER_LISTEN_ADDR: ':9091'
      PROXYLOOM_RUNNER_CA_FILE: /run/secrets/runner_ca
      PROXYLOOM_RUNNER_CERT_FILE: /run/secrets/runner_server_cert
      PROXYLOOM_RUNNER_KEY_FILE: /run/secrets/runner_server_key
      PROXYLOOM_RUNNER_REGISTRY_FILE: /run/secrets/runner_registry
    secrets: [database_dsn, master_key, old_master_keys, token_pepper, content_hmac_key, setup_token, metrics_token, runner_ca, runner_server_cert, runner_server_key, runner_registry]
    ports: ['127.0.0.1:${PROXYLOOM_PORT:-8080}:8080']
    volumes: ['${PROXYLOOM_STATE_DIR:?state directory required}/old-master-keys:/run/old-master-keys:ro']
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001']
    networks: [front, data, control]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /app/proxyloom-server, healthcheck]
      interval: 5s
      timeout: 4s
      retries: 24
    restart: unless-stopped

  runner:
    <<: *limits
    image: ${PROXYLOOM_RUNNER_IMAGE:?load release images first}
    command: [serve]
    init: true
    mem_limit: 1g
    cpus: 2
    environment:
      PROXYLOOM_HTTP_ADDR: '127.0.0.1:9092'
      PROXYLOOM_RUNNER_API_URL: https://api:9091
      PROXYLOOM_RUNNER_ID: ${PROXYLOOM_RUNNER_ID:?initialize runner identity first}
      PROXYLOOM_RUNNER_CORE_ROOT: /cores
      PROXYLOOM_RUNNER_CA_FILE: /run/secrets/runner_ca
      PROXYLOOM_RUNNER_CERT_FILE: /run/secrets/runner_client_cert
      PROXYLOOM_RUNNER_KEY_FILE: /run/secrets/runner_client_key
      PROXYLOOM_RUNNER_NETWORK_ENABLED: 'true'
      PROXYLOOM_RUNNER_NETWORK_GUARD_FILE: /run/network-guard/ready.json
      PROXYLOOM_RUNNER_LOCATION: ${PROXYLOOM_RUNNER_LOCATION:-self-hosted}
    secrets: [runner_ca, runner_client_cert, runner_client_key]
    volumes: ['${PROXYLOOM_STATE_DIR}/network-guard:/run/network-guard:ro']
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m,uid=10002,gid=10002']
    networks: [control, egress]
    healthcheck:
      test: [CMD, /app/proxyloom-runner, healthcheck]
      start_period: 90s
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  operations:
    <<: *limits
    profiles: [operations]
    image: ${PROXYLOOM_OPERATIONS_IMAGE:?load release images first}
    user: '10001:10001'
    command: [admin, backup, --directory, /backups]
    environment:
      <<: *keys
      PROXYLOOM_MIGRATION_DSN_FILE: /run/secrets/migration_dsn
      PROXYLOOM_BACKUP_RECIPIENT_FILE: /run/secrets/backup_recipient
      PROXYLOOM_RESTORE_WORK_DIR: /work
    secrets: [migration_dsn, master_key, old_master_keys, token_pepper, content_hmac_key, backup_recipient]
    volumes:
      - ${PROXYLOOM_STATE_DIR}/old-master-keys:/run/old-master-keys:ro
      - ${PROXYLOOM_STATE_DIR}/backups:/backups
      - ${PROXYLOOM_STATE_DIR}/restore-work:/work
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m,mode=1777']
    networks: [data]
    restart: 'no'

networks:
  front: {}
  data: {internal: true}
  control: {internal: true}
  egress: {}

volumes:
  pgdata: {}

secrets:
  db_bootstrap_password: {file: '${PROXYLOOM_STATE_DIR}/secrets/db_bootstrap_password'}
  db_runtime_password: {file: '${PROXYLOOM_STATE_DIR}/secrets/db_runtime_password'}
  db_migration_password: {file: '${PROXYLOOM_STATE_DIR}/secrets/db_migration_password'}
  database_dsn: {file: '${PROXYLOOM_STATE_DIR}/secrets/database_dsn'}
  migration_dsn: {file: '${PROXYLOOM_STATE_DIR}/secrets/migration_dsn'}
  master_key: {file: '${PROXYLOOM_STATE_DIR}/secrets/master_key'}
  old_master_keys: {file: '${PROXYLOOM_STATE_DIR}/secrets/old_master_keys'}
  token_pepper: {file: '${PROXYLOOM_STATE_DIR}/secrets/token_pepper'}
  content_hmac_key: {file: '${PROXYLOOM_STATE_DIR}/secrets/content_hmac_key'}
  setup_token: {file: '${PROXYLOOM_STATE_DIR}/secrets/setup_token'}
  metrics_token: {file: '${PROXYLOOM_STATE_DIR}/secrets/metrics_token'}
  backup_recipient: {file: '${PROXYLOOM_STATE_DIR}/secrets/backup_recipient'}
  runner_ca: {file: '${PROXYLOOM_IDENTITY_DIR:?identity directory required}/runner_ca'}
  runner_server_cert: {file: '${PROXYLOOM_IDENTITY_DIR}/runner_server_cert'}
  runner_server_key: {file: '${PROXYLOOM_IDENTITY_DIR}/runner_server_key'}
  runner_client_cert: {file: '${PROXYLOOM_IDENTITY_DIR}/runner_client_cert'}
  runner_client_key: {file: '${PROXYLOOM_IDENTITY_DIR}/runner_client_key'}
  runner_registry: {file: '${PROXYLOOM_IDENTITY_DIR}/runner_registry'}
