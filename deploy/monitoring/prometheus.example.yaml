# Integrate with an existing trusted monitoring installation, not a fourth
# required product service. Copy the metrics token to a file it alone can read.
scrape_configs:
  - job_name: proxyloom
    scrape_interval: 30s
    scrape_timeout: 5s
    static_configs:
      - targets: ['127.0.0.1:8080']
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/proxyloom-metrics-token
rule_files:
  - /etc/prometheus/proxyloom-alerts.yaml
