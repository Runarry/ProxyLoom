groups:
  - name: proxyloom
    rules:
      - alert: ProxyLoomUnavailable
        expr: up{job="proxyloom"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: ProxyLoom 指标不可用
          description: 检查 API、数据库及监控令牌；数据库不可用时订阅读取会拒绝服务。
      - alert: ProxyLoomBackupOverdue
        expr: time() - proxyloom_backup_last_success_timestamp_seconds > 86400
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: 最近成功备份已超过 24 小时
          description: 检查备份 timer、目录空间、公钥与数据库连接，立即执行一次备份并验证。
      - alert: ProxyLoomCleanupStalled
        expr: (time() - proxyloom_cleanup_last_success_timestamp_seconds > 900) and (proxyloom_cleanup_paused == 0)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 清理长时间未成功
          description: 检查数据库锁与清理错误；不要绕过引用保护直接删除修订。
      - alert: ProxyLoomExecutionQueueStalled
        expr: (proxyloom_jobs{state="queued"} > 0) and (changes(proxyloom_jobs{state="queued"}[15m]) == 0)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 队列持续等待
          description: 检查 Runner 健康、隔离就绪记录、mTLS 登记、构建资格和并发槽位。
      - alert: ProxyLoomServerErrors
        expr: sum(rate(proxyloom_http_requests_total{status_class="5xx"}[5m])) / clamp_min(sum(rate(proxyloom_http_requests_total[5m])), 0.01) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: API 服务错误比例偏高
          description: 检查安全错误码和数据库状态，不在监控标签中加入资源 ID 或请求 URL。
