name: Engineering checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.0'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.6.0'
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.2
      - name: Resolve contract comparison base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            echo "QUALITY_BASE_REF=$PR_BASE" >> "$GITHUB_ENV"
          elif [ -n "$PUSH_BASE" ] && [ "$PUSH_BASE" != "0000000000000000000000000000000000000000" ]; then
            echo "QUALITY_BASE_REF=$PUSH_BASE" >> "$GITHUB_ENV"
          else
            echo "QUALITY_BASE_REF=HEAD" >> "$GITHUB_ENV"
          fi
      - name: Unified quality gates including PostgreSQL identity
        run: node scripts/check-quality.mjs
      - name: Scan and stage bounded evidence
        id: stage-evidence
        if: always()
        run: node scripts/check-quality-evidence.mjs
      - name: Retain scanned quality diagnostics
        if: always() && steps.stage-evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-evidence-${{ github.run_attempt }}
          # The collector permits only named reports/manifests/Go diagnostics,
          # scans before copying and rejects stale output directories.
          path: .cache/quality-upload/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  development-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.6.0'
      - name: Verify tool and image locks
        run: node scripts/check-locks.mjs
      - name: Initialize local development credentials
        run: pwsh -File scripts/dev-init.ps1
      - name: Build and verify development Compose
        run: pwsh -File scripts/smoke.ps1 -Build
