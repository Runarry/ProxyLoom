name: Engineering checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.0'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.6.0'
      - name: PLAN, boundaries, formatting, dependencies, vet, race tests
        run: |
          node --test scripts/foundation-report.test.mjs scripts/postgres-init.test.mjs
          node scripts/install-sqlc.mjs
          node scripts/check.mjs
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.2
      - name: Frontend frozen install, type check and build
        working-directory: proxyloom-web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
      - name: API generated types match the contract
        run: node scripts/check-api.mjs
      - name: PostgreSQL foundation integration
        run: node scripts/verify-foundation.mjs
      - name: Retain foundation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-evidence-${{ github.run_attempt }}
          # Only these evidence files; never upload the credentials directory.
          # The verifier rejects registered generated secrets before saving Go output.
          path: |
            .cache/foundation/*/report.json
            .cache/foundation/*/source-manifest.json
            .cache/foundation/*/go-test.jsonl
            .cache/foundation/*/go-stderr.txt
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  development-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.6.0'
      - name: Verify tool and image locks
        run: node scripts/check-locks.mjs
      - name: Initialize local development credentials
        run: pwsh -File scripts/dev-init.ps1
      - name: Build and verify development Compose
        run: pwsh -File scripts/smoke.ps1 -Build
